   计算与渲染
   =========================================================== */
/* 更新零极点坐标明细面板 */
function renderZPPanel(){
  const setList=(elId,arr,cls)=>{
    const el=document.getElementById(elId);
    if(!el) return;
    if(!arr||!arr.length){
      el.innerHTML='<div class="zp-row" style="color:#6b7686">（无）</div>';
      return;
    }
    el.innerHTML=arr.map((r,i)=>{
      const c=fmtComplex(r);
      const pol=fmtPolar(r);
      return '<div class="zp-row"><span class="zp-idx">'+(i+1)+'</span>'
           + '<span class="'+cls+'">'+c+'</span>'
           + '<span class="zp-polar">'+pol+'</span></div>';
    }).join('');
  };
  const info=state.rl.data||{};
  const poles=info.poles||[], zeros=info.zeros||[];
  setList("zpPoles",poles,"");
  setList("zpZeros",zeros,"");
  const pc=document.getElementById("zpPoleCount"), zc=document.getElementById("zpZeroCount");
  if(pc) pc.textContent=" ("+poles.length+")";
  if(zc) zc.textContent=" ("+zeros.length+")";

  // 系统信息：阶数、渐近线、分离点
  const mi=document.getElementById("zpInfo");
  if(mi){
    /* 含纯滞后时没有根轨迹数据，只说明系统构成与延迟量。 */
    if(!state.rl.data){
      const tau=state.tau||0;
      mi.innerHTML='纯滞后系统：G(s) = N(s)/D(s) · e^(−τs)，τ = <b>'+tau+'</b><br>'
        + '含延迟的特征方程是超越方程，<b>不给出极点/零点/分离点</b>；<br>'
        + '请切换到「奈奎斯特 / 伯德」页查看频域特性。';
      return;
    }
    const n=poles.length, m=zeros.length;
    const rows=[];
    rows.push('开环极点 <b>n = '+n+'</b>　开环零点 <b>m = '+m+'</b>');
    const na=n-m;
    if(na>0){
      // 渐近线：角度与实轴交点
      const sumP=poles.reduce((s,p)=>s+p.re,0), sumZ=zeros.reduce((s,z)=>s+z.re,0);
      const sigma=(sumP-sumZ)/na;
      const angs=[];
      for(let k=0;k<na;k++){
        let a=(2*k+1)*180/na;                   // K>0 的渐近线角
        if(state.kSign<0) a=(2*k)*180/na;       // K<0 用 0° 族
        angs.push(((a%360)+360)%360);
      }
      rows.push('渐近线 ' + angs.map(a=>a.toFixed(0)+'°').join('、')
                + '　交点 σ = <b>'+parseFloat(sigma.toPrecision(4))+'</b>');
    }else{
      rows.push('渐近线：n = m，无渐近线');
    }
    // 分离点/会合点
    try{
      const bps=breakawayPoints(state.Nc,state.Dc,state.kSign);
      if(bps.length){
        rows.push('分离/会合点 ' + bps.map(b=>'<b>'+fmtComplex(b.s)+'</b> (K='+parseFloat(b.K.toPrecision(4))+')').join('　'));
      }else{
        rows.push('实轴分离点：无');
      }
    }catch(e){ /* 忽略 */ }
    mi.innerHTML=rows.join('<br>');
  }
}

function redraw(){
  syncMargins();                 // 每次重绘前按当前画布尺寸更新边距
  if(state.tab==="p-rl") drawRootLocus();
  else { drawPolar(); drawBode(); }
}
function recompute(keepView){
  const errEl=document.getElementById("err");
  const noteEl=document.getElementById("delayNote");
  try{
    const Nres=parseExpr(document.getElementById("in-num").value);
    const Dres=parseExpr(document.getElementById("in-den").value);
    const Nc=Nres.poly, Dc=Dres.poly;
    if(Dc.length<2) throw new Error("分母必须含 s（正次多项式）");
    // 含延迟时，根轨迹无法计算（超越方程），只做频域分析
    const tau=(Nres.delay||0)+(Dres.delay||0);
    state.tau=tau;
    state.Nc=Nc; state.Dc=Dc;
    state.w1=Math.max(1e-4, parseFloat(document.getElementById("in-w").value)||0.01);
    state.w2=Math.max(state.w1*10, parseFloat(document.getElementById("in-w2").value)||1000);
    errEl.textContent="";

    if(tau>0){
      /* —— 含纯滞后 e^(-τs)：只算频域 ——
         频域用精确值（幅值不变、相位 -ωτ），不做任何近似。
         根轨迹是超越方程（无穷多根），此处无法给出，改为提示。 */
      state.rl.data=null;
      state.ny.data={freq:buildFreqPoints(Nc,Dc,state.w1,state.w2,1400,tau)};
      if(state.ny.data.freq.length<2) throw new Error("频率范围内无有效响应");
      if(!keepView||!state.ny.view) autoFitNY();
      if(noteEl){
        const shown=(Nres.delayRaw||Dres.delayRaw||("e^(-"+tau+"s)"));
        noteEl.innerHTML='已识别纯滞后 <b>'+shown+'</b>（τ='+tau+'）'
          +'：频域为<b>精确</b>计算（幅值不变、相位 −ωτ）；'
          +'<b>根轨迹不可用</b>——含延迟的特征方程是超越方程，有无穷多根，'
          +'请改用奈奎斯特 / 伯德图判稳。';
        noteEl.classList.add("show");
      }
      // 若当前停在根轨迹页，自动切到频域页，避免空白
      if(state.tab==="p-rl"){
        const btnNy=document.querySelector('.tab[data-target="p-ny"]');
        if(btnNy) btnNy.click();
      }
    }else{
      // —— 无延迟：常规多项式处理 ——
      const branches=computeRootLocus(Nc,Dc,state.kSign,1e4,220);
      const info=fitRootLocus(branches,Nc,Dc);
      state.rl.data={branches, zeros:info.zeros, poles:info.poles};
      if(!keepView||!state.rl.view) state.rl.view={cx:info.cx, cy:info.cy, half:info.half};

      state.ny.data={freq:buildFreqPoints(Nc,Dc,state.w1,state.w2,900,0)};
      if(state.ny.data.freq.length<2) throw new Error("频率范围内无有效响应");
      if(!keepView||!state.ny.view) autoFitNY();
      if(noteEl){ noteEl.classList.remove("show"); noteEl.innerHTML=""; }
    }
  }catch(e){
    errEl.textContent="⚠ "+e.message;
    console.error(e);
  }
  try{ renderZPPanel(); }catch(e){ console.error(e); }
  redraw();
}

(function initAuthorPop(){
  const wrap=document.querySelector(".author");
  const pop=document.getElementById("authorPop");
  const av=document.querySelector(".author-avatar");
  const popAv=document.getElementById("popAvatar");
  if(!wrap||!pop||!av) return;

  // 浮层内头像复用同一张图，避免重复内联 base64
  if(popAv && av.getAttribute("src")) popAv.src=av.getAttribute("src");

  /* 浮层用 position:fixed，需按视口定位并做边界钳位：
     署名区在最右侧，若简单地右对齐，窄屏下浮层会向左溢出被裁掉。
     这里让浮层优先与署名区右缘对齐，超出左边界则贴左边，
     并同步调整小箭头位置指向头像。 */
  const place=()=>{
    const r=av.getBoundingClientRect();
    const pw=pop.offsetWidth || 212;
    const ph=pop.offsetHeight || 96;
    const vw=window.innerWidth, vh=window.innerHeight;
    const M=8, ARROW=18;
    // 水平：默认右缘对齐署名区右缘
    let left = r.right - pw;
    if(left < M) left = M;                           // 超出左边界 -> 贴左
    if(left + pw > vw - M) left = vw - M - pw;       // 超出右边界 -> 贴右
    // 垂直：优先放在署名区下方
    let top = r.bottom + 10;
    let below = true;
    if(top + ph > vh - M){                           // 下方不够 -> 放到上方
      top = r.top - ph - 10;
      below = false;
    }
    if(top < M) top = M;
    pop.style.left = Math.round(left) + "px";
    pop.style.top  = Math.round(top) + "px";
    // 箭头对准头像中心
    const arrowX = Math.round(r.left + r.width/2 - left - 5.5);
    pop.style.setProperty("--arrow-x", Math.max(10, Math.min(pw-22, arrowX)) + "px");
    // 箭头方向随上下位置切换
    pop.classList.toggle("above", !below);
  };

  const setOpen=(on)=>{
    pop.classList.toggle("show",on);
    wrap.classList.toggle("open",on);
    av.setAttribute("aria-expanded",on?"true":"false");
    if(on) place();
  };
  const isOpen=()=>pop.classList.contains("show");

  // 视口变化时若浮层开着，重新定位
  window.addEventListener("resize",()=>{ if(isOpen()) place(); });
  window.addEventListener("scroll",()=>{ if(isOpen()) place(); },{passive:true});

  // 点击署名区（含头像）开合
  wrap.addEventListener("click",(e)=>{
    if(e.target.closest("#popCopy")) return;      // 复制按钮单独处理
    e.stopPropagation();
    setOpen(!isOpen());
  });
  // 点击其它地方关闭
  document.addEventListener("click",(e)=>{
    if(isOpen() && !wrap.contains(e.target)) setOpen(false);
  });
  // Esc 关闭
  document.addEventListener("keydown",(e)=>{
    if(e.key==="Escape" && isOpen()){ setOpen(false); av.focus(); }
  });

  // 复制 QQ 号（本地文件环境下 clipboard API 可能被禁用，故带回退方案）
  const btn=document.getElementById("popCopy");
  const qq=document.getElementById("popQQ");
  if(btn && qq){
    btn.addEventListener("click",async (e)=>{
      e.stopPropagation();
      const txt=qq.textContent.trim();
      let ok=false;
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(txt); ok=true;
        }
      }catch(_){ ok=false; }
      // 始终先选中号码：即使自动复制被浏览器禁止（file:// 下常见），
      // 用户也能直接 Ctrl+C，无需手动拖选。
      try{
        const r=document.createRange(); r.selectNodeContents(qq);
        const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
        if(!ok && document.execCommand) ok=document.execCommand("copy");
      }catch(_){ /* 忽略 */ }
      const old=btn.textContent;
      btn.textContent=ok?"已复制":"已选中，按 Ctrl+C";
      setTimeout(()=>{ btn.textContent=old; }, 1600);
    });
  }
})();

/* 伯德图显示方式切换：分图 <-> 合并，带融合动画。
   动画通过 state.bode.mix 从 0 连续变到 1（或反向），
   每帧调用 redraw()，drawBode 会按 mix 插值两格的几何，形成平滑过渡。 */
(function initBodeMode(){
  const btn=document.getElementById("btn-bode-mode");
  const txt=document.getElementById("bodeModeText");
  if(!btn||!txt) return;

  let rafId=null;
  const DURATION=380;                     // 动画时长 ms

  const animateTo=(target)=>{
    const from=state.bode.mix;
    const t0=performance.now();
    state.bode.animating=true;
    if(rafId) cancelAnimationFrame(rafId);
    const step=()=>{
      const t=Math.min(1, (performance.now()-t0)/DURATION);
      // easeInOutCubic：起止平滑
      const e = t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
      state.bode.mix = from + (target-from)*e;
      redrawOnlyBode();
      if(t<1){ rafId=requestAnimationFrame(step); }
      else{
        state.bode.mix=target;
        state.bode.animating=false;
        rafId=null;
        redrawOnlyBode();
      }
    };
    rafId=requestAnimationFrame(step);
  };

  // 只重绘伯德图（避免整页重算）
  const redrawOnlyBode=()=>{
    if(state.tab!=="p-ny") return;
    drawBode();
  };

  const sync=()=>{
    const merged=state.bode.mode==="merged";
    txt.textContent = merged ? "合并显示" : "分图显示";
    btn.classList.toggle("on", merged);
    btn.title = merged ? "切换为分图显示（幅频/相频分开）" : "切换为合并显示（幅频/相频同图）";
  };
  sync();

  btn.addEventListener("click",(e)=>{
    e.stopPropagation();
    const toMerged = state.bode.mode==="split";
    state.bode.mode = toMerged ? "merged" : "split";
    sync();
    animateTo(toMerged ? 1 : 0);
  });
})();

function attachView(cv,getView,getMargins,isRL){
  // 统一处理鼠标滚轮与触摸手势（单指平移、双指捏合缩放）
  const geom=()=>{
    const v=getView(); if(!v) return null;
    const m=getMargins();
    const iw=cv.clientWidth-m.l-m.r, ih=cv.clientHeight-m.t-m.b;
    const k=Math.min(iw,ih)/(2*v.half);
    return {v,m,iw,ih,k};
  };
  // 以画布内某点为锚点缩放
  const zoomAt=(mx,my,factor)=>{
    const g=geom(); if(!g) return;
    const {v,m,iw,ih,k}=g;
    const dataX=v.cx+(mx-(m.l+iw/2))/k;
    const dataY=v.cy-(my-(m.t+ih/2))/k;
    const half=Math.max(1e-6, Math.min(1e9, v.half*factor));
    const kNew=Math.min(iw,ih)/(2*half);
    v.cx=dataX-(mx-(m.l+iw/2))/kNew;
    v.cy=dataY+(my-(m.t+ih/2))/kNew;
    v.half=half;
    redraw();
  };
  // 按屏幕像素平移
  const panBy=(dxPx,dyPx)=>{
    const g=geom(); if(!g) return;
    const {v,k}=g;
    v.cx-=dxPx/k;
    v.cy+=dyPx/k;
    redraw();
  };
  // ---- 鼠标滚轮 ----
  cv.addEventListener("wheel",e=>{
    if(!getView()) return;
    e.preventDefault();
    const r=cv.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(e.deltaY*0.0012));
  },{passive:false});

  // ---- 鼠标拖拽 ----
  let drag=null;
  cv.addEventListener("mousedown",e=>{
    const v=getView(); if(!v) return;
    drag={x:e.clientX,y:e.clientY};
    cv.style.cursor="grabbing";
  });
  window.addEventListener("mousemove",e=>{
    if(!drag) return;
    panBy(e.clientX-drag.x, e.clientY-drag.y);
    drag.x=e.clientX; drag.y=e.clientY;
  });
  window.addEventListener("mouseup",()=>{ if(drag){ drag=null; cv.style.cursor="crosshair"; } });

  // ---- 触摸：单指平移 / 双指捏合 ----
  // 记录进行中的触摸状态
  let touch=null;
  const dist2=(a,b)=>Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  const mid2=(a,b)=>({clientX:(a.clientX+b.clientX)/2, clientY:(a.clientY+b.clientY)/2});

  cv.addEventListener("touchstart",e=>{
    const v=getView(); if(!v) return;
    if(e.touches.length===1){
      touch={mode:"pan", x:e.touches[0].clientX, y:e.touches[0].clientY};
    }else if(e.touches.length>=2){
      const a=e.touches[0], b=e.touches[1];
      touch={mode:"pinch", d0:dist2(a,b), mid0:mid2(a,b)};
    }
    // 阻止页面滚动/缩放，手势交给画布
    e.preventDefault();
  },{passive:false});

  cv.addEventListener("touchmove",e=>{
    const v=getView(); if(!v||!touch) { return; }
    e.preventDefault();
    if(touch.mode==="pan" && e.touches.length===1){
      const t=e.touches[0];
      panBy(t.clientX-touch.x, t.clientY-touch.y);
      touch.x=t.clientX; touch.y=t.clientY;
    }else if(touch.mode==="pinch" && e.touches.length>=2){
      const a=e.touches[0], b=e.touches[1];
      const d=dist2(a,b);
      const mid=mid2(a,b);
      const r=cv.getBoundingClientRect();
      /* 捏合处理要点：
         1) 缩放锚点用【上一帧的中点】而不是当前中点——
            当前中点相对上帧已经移动过，若用它做锚点，位移会被计入两次，
            导致画面朝一侧大幅漂移。
         2) 中点自身相对上帧的位移作为纯平移，跟手移动。 */
      const prevMidLocal = { x: touch.mid0.clientX - r.left, y: touch.mid0.clientY - r.top };
      if(touch.d0>0 && d>0){
        zoomAt(prevMidLocal.x, prevMidLocal.y, touch.d0/d);
      }
      panBy(mid.clientX-touch.mid0.clientX, mid.clientY-touch.mid0.clientY);
      touch.d0=d; touch.mid0=mid;
    }
  },{passive:false});

  const endTouch=(e)=>{
    if(e.touches && e.touches.length===0) touch=null;
    else if(e.touches && e.touches.length===1 && touch){
      // 从双指变单指：切换回平移，避免跳变
      touch={mode:"pan", x:e.touches[0].clientX, y:e.touches[0].clientY};
    }
  };
  cv.addEventListener("touchend",endTouch);
  cv.addEventListener("touchcancel",endTouch);

  // 双击/双指轻点复位
  cv.addEventListener("dblclick",()=>{
    state.rl.view=null; state.ny.view=null; recompute(true);
  });
}

});

/* 用 ResizeObserver 监听每个画布的尺寸变化：
   canvas 的位图尺寸不会自动跟随 CSS 尺寸，切换 Tab / 窗口缩放 /
   容器变化导致 0 -> 非0 时都必须重绘，否则会看到空白画布。 */
if(typeof ResizeObserver!=="undefined"){
  ["cv-rl","cv-pol","cv-bode"].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    let lastW=0,lastH=0;
    new ResizeObserver(()=>{
      const w=el.clientWidth, h=el.clientHeight;
      if(w!==lastW||h!==lastH){
        lastW=w; lastH=h;
        if(w>0&&h>0) scheduleRedraw();
      }
    }).observe(el);
  });
}

/* ===========================================================
   输入联想：键入符号后提示"下一个合法符号"
   -----------------------------------------------------------
   只提示语法上接得上的符号，不做语法分析，因此不会干扰正常输入：
   - 字母数字后 -> 运算符、(、s、e
   - '^' 后     -> 数字、(
   - '(' 后     -> 数字、s、e、-
   - 运算符后   -> 数字、s、e、(、-

   桌面端：Tab 唤起/接受，Esc 关闭，↑↓ 选择，鼠标点击。
   移动端：软键盘没有 Tab/Esc，改为——
     · 聚焦输入框即自动列出候选（无需按键唤起）
     · 触摸点选候选（用 touchstart，不用 mousedown）
     · 用视觉提示条告知"点一下"即可插入

   浮层挂在 <body> 上并用 position:fixed 定位：
   窄屏下 .bar 是 overflow-x:auto/overflow-y:hidden 的横向滚动条，
   绝对定位的子元素会被裁掉（实测只露出几像素），必须脱离该容器。
   =========================================================== */
function initAutocomplete(input, listEl){
  const SUG_OP   =[["+","加"],["-","减"],["*","乘"],["/","除"],["^","幂"]];
  const SUG_AFTER_VAR=[["+","加"],["-","减"],["*","乘"],["/","除"],["^","幂"],["(","左括号"],["s","变量 s"],["e","延迟/常数 e"]];
  const SUG_NUM  =[["+","加"],["-","减"],["*","乘"],["/","除"],["^","幂"],["(","左括号"],["s","变量 s"],["e","延迟/常数 e"],["0","0"],["1","1"],["2","2"],["5","5"]];
  const SUG_CARET=[["0","0 次"],["1","1 次"],["2","2 次"],["3","3 次"],["(","括号指数"]];
  const SUG_LPAREN=[["s","变量 s"],["1","数字 1"],["2","数字 2"],["e","延迟/常数 e"],["-","负号"]];

  // 是否为触屏设备：决定"自动弹出"与"点选"行为
  const isCoarse = (window.matchMedia && window.matchMedia("(pointer:coarse)").matches)
                   || ("ontouchstart" in window && navigator.maxTouchPoints>0);

  let items=[], sel=0, open=false;

  /* 把浮层移到 body 下：脱离 .bar 的 overflow 裁剪。
     只做一次，重复调用无副作用。 */
  if(listEl.parentElement!==document.body){
    document.body.appendChild(listEl);
  }

  function candidates(){
    const v=input.value;
    const pos=input.selectionStart===null?v.length:input.selectionStart;
    let k=pos-1;
    while(k>=0 && /\s/.test(v[k])) k--;
    if(k<0) return SUG_NUM;
    const c=v[k];
    if(c==="^") return SUG_CARET;
    if(c==="(") return SUG_LPAREN;
    if(/[+\-*/]/.test(c)) return SUG_NUM;
    if(c===")") return SUG_OP;
    if(/[0-9.]/.test(c)) return SUG_NUM;
    if(c==="s"||c==="e") return SUG_AFTER_VAR;
    return SUG_OP;
  }

  /* 定位：贴在输入框下方；下方放不下就翻到上方；
     水平方向优先与输入框左缘对齐，越界则贴边。 */
  function place(){
    const r=input.getBoundingClientRect();
    const lw=listEl.offsetWidth  || 160;
    const lh=listEl.offsetHeight || 180;
    const vw=window.innerWidth, vh=window.innerHeight;
    const M=8;

    let left = r.left;
    if(left+lw > vw-M) left = vw-M-lw;
    if(left < M) left = M;

    /* 垂直：默认放输入框下方。
       移动端软键盘会占据下半屏，用 visualViewport 拿到"可见区域"高度，
       避免浮层被键盘挡住——这是触屏上最关键的一处适配。 */
    const vv=window.visualViewport;
    const visTop = vv ? vv.offsetTop : 0;
    const visH   = vv ? vv.height    : vh;
    const visBottom = visTop + visH;

    let top = r.bottom + 4;
    const roomBelow = visBottom - top;
    const roomAbove = (r.top - visTop) - 4;
    // 下方不够且上方更宽敞 -> 翻到上方
    if(roomBelow < lh && roomAbove > roomBelow){
      top = r.top - lh - 4;
    }
    // 最终钳位在可见区域内
    if(top + lh > visBottom - M) top = visBottom - M - lh;
    if(top < visTop + M) top = visTop + M;

    listEl.style.left = Math.round(left)+"px";
    listEl.style.top  = Math.round(top)+"px";
    listEl.style.right = "auto";
  }

  function render(){
    if(!items.length){ close(); return; }
    listEl.innerHTML="";
    items.forEach((it,idx)=>{
      const d=document.createElement("div");
      d.className="ac-item"+(idx===sel?" sel":"");
      d.innerHTML='<span class="ac-sym"></span><span class="ac-desc"></span>';
      d.querySelector(".ac-sym").textContent=it[0];
      d.querySelector(".ac-desc").textContent=it[1];
      /* 触屏用 touchstart、鼠标用 mousedown：
         移动端不一定派发 mousedown，只绑 mousedown 会导致"点了没反应"。
         两者都 preventDefault，避免 input 先失焦而把列表关掉。 */
      const pick=(e)=>{ e.preventDefault(); e.stopPropagation(); sel=idx; accept(); };
      d.addEventListener("touchstart",pick,{passive:false});
      d.addEventListener("mousedown",pick);
      listEl.appendChild(d);
    });
    /* 触屏上补一行操作提示：软键盘没有 Tab/Enter，
       明确告诉用户"点一下就能插入"，否则容易以为只是装饰。 */
    if(isCoarse && items.length){
      const tip=document.createElement("div");
      tip.className="ac-tip";
      tip.textContent="点选即可插入";
      listEl.appendChild(tip);
    }
    listEl.classList.add("show");
    open=true;
    place();
  }

  function close(){ listEl.classList.remove("show"); open=false; }

  function accept(){
    if(!open || !items.length) return;
    const sym=items[sel][0];
    const v=input.value;
    const pos=input.selectionStart===null?v.length:input.selectionStart;
    const end=input.selectionEnd===null?pos:input.selectionEnd;
    input.value=v.slice(0,pos)+sym+v.slice(end);
    const np=pos+sym.length;
    try{ input.setSelectionRange(np,np); }catch(_){}
    close();
    input.dispatchEvent(new Event("input",{bubbles:true}));
    /* 触屏上不要重新 focus()：会反复弹出软键盘、打断输入节奏。
       桌面端保留 focus 以便连续键盘操作。 */
    if(!isCoarse) input.focus();
  }

  function show(){ items=candidates(); sel=0; render(); }

  // 输入时若已打开则实时刷新候选
  input.addEventListener("input",()=>{ if(open){ items=candidates(); sel=0; render(); } });

  // 聚焦即弹出（触屏唯一的"唤起"方式）；桌面端也顺手弹出，无副作用
  input.addEventListener("focus",()=>{ show(); });
  input.addEventListener("click",()=>{ if(open){ items=candidates(); render(); } else show(); });

  input.addEventListener("keydown",(e)=>{
    if((e.ctrlKey&&e.key===" ")||(e.altKey&&e.key==="/")){
      e.preventDefault(); show(); return;
    }
    if(!open){
      if(e.key==="Tab"){ e.preventDefault(); show(); }
      return;
    }
    if(e.key==="Escape"){ e.preventDefault(); close(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); sel=(sel+1)%items.length; render(); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); sel=(sel-1+items.length)%items.length; render(); return; }
    if(e.key==="Tab"||e.key==="Enter"){ e.preventDefault(); accept(); return; }
  });

  /* 失焦关闭。
     触屏上点候选会先触发 blur，若立刻关闭就来不及 accept，
     故触屏延长等待；桌面端保持较短以避免残留。 */
  input.addEventListener("blur",()=>{ setTimeout(close, isCoarse?260:120); });

  // 视口/键盘变化时重新定位（软键盘弹出会改变 visualViewport）
  const reflow=()=>{ if(open) place(); };
  window.addEventListener("resize",reflow);
  window.addEventListener("scroll",reflow,{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",reflow);
    window.visualViewport.addEventListener("scroll",reflow);
  }

  // 点击/触摸浮层与输入框以外的地方关闭
  const outside=(e)=>{
    if(!open) return;
    if(listEl.contains(e.target) || e.target===input) return;
    close();
  };
  document.addEventListener("mousedown",outside);
  document.addEventListener("touchstart",outside,{passive:true});
}

initAutocomplete(document.getElementById("in-num"), document.getElementById("ac-num"));
initAutocomplete(document.getElementById("in-den"), document.getElementById("ac-den"));

/* 首次计算放到布局稳定之后：
   若在脚本执行末尾立刻算，画布可能还没拿到最终尺寸，
   自动视野会按错误尺寸估算。用 rAF + load 双保险。 */
function firstRender(){
  state.rl.view=null;
  state.ny.view=null;
  recompute(false);
}
if(document.readyState==="complete"){
  requestAnimationFrame(firstRender);
}else{
  window.addEventListener("load",()=>requestAnimationFrame(firstRender));
  // 兜底：即便 load 事件因某种原因未触发也要出图
  setTimeout(()=>{ if(!state.rl.data) firstRender(); }, 300);
}
</script>
</body>
</html>
