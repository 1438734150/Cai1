<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 手机端适配：viewport-fit 覆盖刘海屏，禁止页面级缩放让手势交给画布 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>根轨迹 / 奈奎斯特·伯德 分析器</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --line:#232b37; --fg:#e6edf3; --dim:#8b98a9;
    --accent:#4c8dff; --red:#e60012;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
  h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
  #tabs{display:flex;gap:6px;margin-left:auto}
  .tab{
    background:#1b2230; color:var(--dim); border:1px solid var(--line); border-radius:8px;
    padding:7px 18px; font-size:13px; cursor:pointer; transition:.15s;
  }
  .tab:hover{color:var(--fg);border-color:#3a4658}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,141,255,.18)}
  .bar{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:8px 16px;background:#12161d;border-bottom:1px solid var(--line);font-size:13px;
  }
  .bar label{display:flex;align-items:center;gap:6px;color:var(--dim);white-space:nowrap}
  .bar input[type=text]{
    background:#0b0e13;border:1px solid var(--line);color:var(--fg);border-radius:6px;
    padding:5px 9px;font:12px/1.4 Consolas,monospace;width:250px;
  }
  .bar input[type=text]:focus{outline:none;border-color:var(--accent)}
  .bar input[type=number]{
    background:#0b0e13;border:1px solid var(--line);color:var(--fg);border-radius:6px;
    padding:5px 7px;width:80px;font:12px/1.4 Consolas,monospace;
  }
  .bar button{
    background:#1b2230;color:var(--fg);border:1px solid var(--line);border-radius:6px;
    padding:6px 13px;cursor:pointer;font-size:12.5px;
  }
  .bar button:hover{border-color:var(--accent);color:#fff}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:#1b2230;padding:6px 14px}
  .seg button.on{background:var(--accent);color:#fff}
  .hint{margin-left:auto;color:var(--dim);font-size:12px}
  #err{color:#ff6b6b;font:12px/1.4 Consolas,monospace;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{flex:1 1 auto;position:relative;min-height:180px;overflow:hidden}
  .panel{position:absolute;inset:0;display:none;min-height:0}
  .panel.active{display:block}
  /* 用绝对定位而非 flex 百分比高度：
     flex + height:100% 在部分浏览器/缩放下会让 canvas 高度算成 0，
     导致画布空白。绝对定位的 inset 更稳。
     注意必须用 width/height:100% 而不是 auto：
     canvas 是替换元素，width:auto + left/right 约束会回退到固有尺寸，
     导致尺寸指数级膨胀。 */
  /* 奈奎斯特/伯德页：左右并排 —— 左格幅相频（极坐标），右格伯德图。
     伯德图内部再上下分幅频/相频。
     宽度按 4:5 分配：极坐标图接近正方更合适，伯德图需要更宽以容纳
     十倍频程刻度和右侧相位刻度。
     窄屏（手机竖屏）空间不足以并排，改为上下堆叠（见媒体查询）。 */
  .grid2{
    position:absolute;inset:0;display:grid;
    grid-template-columns:4fr 5fr;grid-template-rows:1fr;
    gap:1px;background:var(--line);
  }
  .cell{position:relative;background:var(--bg);min-height:0;overflow:hidden}
  .cell > canvas{
    position:absolute;left:0;top:26px;
    width:100%;height:calc(100% - 26px);
  }
  .legend{
    position:absolute;left:0;right:0;top:0;height:26px;
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    padding:0 12px;font-size:11.5px;color:var(--dim);z-index:2;
    border-bottom:1px solid rgba(255,255,255,.04);
  }
  .legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .legend i{display:inline-block;width:16px;height:2px;border-radius:1px}
  .legend i.solid{background:#4fc3f7}
  .legend i.dashed{background:repeating-linear-gradient(90deg,#4fc3f7 0 5px,transparent 5px 9px)}
  .legend i.mag{background:#35c1ff}
  .legend i.ph{background:#ffb340}
  .legend i.arrow{
    width:0;height:0;background:none;border-radius:0;
    border-left:8px solid #7fe3ff;border-top:5px solid transparent;border-bottom:5px solid transparent;
  }
  /* 伯德图显示方式切换按钮 */
  .legend-btn{
    margin-left:auto;display:inline-flex;align-items:center;gap:5px;
    background:#1b2230;color:var(--dim);
    border:1px solid var(--line);border-radius:6px;
    padding:3px 9px;font-size:11px;cursor:pointer;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
    flex:0 0 auto;
  }
  .legend-btn:hover{color:#fff;border-color:var(--accent)}
  .legend-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .legend-btn-icon{font-size:12px;line-height:1}
  /* ω 方向切换：图例内的紧凑按钮，不参与 margin-left:auto 的推挤 */
  .legend .legend-btn{
    margin-left:0;padding:2px 7px;font-size:11px;
    background:transparent;border-color:transparent;
  }
  .legend .legend-btn.on{background:#243244;color:#e8eef7;border-color:var(--line)}
  .legend .legend-btn:hover{background:#1f2a3a;color:#fff;border-color:var(--line)}
  canvas{
    display:block;cursor:crosshair;
    /* 触摸手势全部交给脚本处理（单指平移、双指缩放），
       避免浏览器把 pinch 当成页面缩放、或把滑动当成滚动 */
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #cv-rl{width:100%;height:100%}
  .cell .tag{
    position:absolute;left:10px;top:8px;font-size:11.5px;color:var(--dim);
    background:rgba(14,17,22,.72);padding:2px 8px;border-radius:5px;pointer-events:none;
    border:1px solid rgba(255,255,255,.05);z-index:2;
  }
  .vbtns{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
  .vbtns button{
    width:34px;height:34px;border-radius:8px;background:rgba(27,34,48,.9);color:var(--fg);
    border:1px solid var(--line);cursor:pointer;font-size:15px;line-height:1;
  }
  .vbtns button:hover{border-color:var(--accent);background:var(--accent);color:#fff}

  /* 作者署名 */
  .author{
    display:flex;align-items:center;gap:9px;margin-left:14px;flex:0 0 auto;
    cursor:pointer;position:relative;
  }
  .author-avatar{
    width:38px;height:38px;border-radius:10px;object-fit:cover;flex:0 0 auto;
    border:1.5px solid rgba(255,179,64,.55);
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .author:hover .author-avatar{transform:rotate(-6deg) scale(1.06);border-color:#ffb340}
  .author-text{display:flex;flex-direction:column;line-height:1.15}
  .author-badge{
    font-size:13.5px;font-weight:700;letter-spacing:.6px;white-space:nowrap;
    color:#ffffff;                                   /* 白色显示 */
  }
  .author-tip{font-size:10.5px;color:var(--dim);letter-spacing:2.5px}

  /* 作者信息浮层：点击头像弹出。
     用 position:fixed 而不是 absolute —— 窄屏下署名区靠右，
     absolute + right:0 会让浮层向左溢出被窗口裁掉。
     fixed 后由脚本按视口宽度钳位。 */
  .author-pop{
    position:fixed;top:0;left:0;z-index:200;
    min-width:212px;max-width:min(260px, calc(100vw - 24px));
    padding:12px 14px;
    background:#161b24;border:1px solid #2b3646;border-radius:10px;
    box-shadow:0 10px 28px rgba(0,0,0,.5);
    font-size:12.5px;color:var(--fg);
    opacity:0;visibility:hidden;transform:translateY(-6px);
    transition:opacity .16s ease, transform .16s ease, visibility .16s;
  }
  .author-pop.show{opacity:1;visibility:visible;transform:translateY(0)}
  /* 小箭头指向头像（位置由脚本设置 --arrow-x） */
  .author-pop::before{
    content:"";position:absolute;top:-6px;left:var(--arrow-x, 18px);
    width:11px;height:11px;
    background:#161b24;border-left:1px solid #2b3646;border-top:1px solid #2b3646;
    transform:rotate(45deg);
  }
  /* 浮层出现在署名区上方时，箭头翻到下方 */
  .author-pop.above::before{
    top:auto;bottom:-6px;border-left:0;border-top:0;
    border-right:1px solid #2b3646;border-bottom:1px solid #2b3646;
  }
  .author-pop h4{
    margin:0 0 9px;font-size:12px;font-weight:600;color:#fff;
    letter-spacing:.5px;display:flex;align-items:center;gap:7px;
  }
  .author-pop h4 img{width:22px;height:22px;border-radius:6px;object-fit:cover}
  .author-pop .pop-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:6px 0;border-top:1px solid rgba(255,255,255,.06);
  }
  .author-pop .pop-row:first-of-type{border-top:0}
  .author-pop .pop-k{color:var(--dim);font-size:11.5px}
  .author-pop .pop-v{
    font:12.5px/1 Consolas,"Cascadia Mono",monospace;color:#fff;
    user-select:all;cursor:text;
  }
  .author-pop .pop-copy{
    margin-left:6px;font-size:10.5px;color:var(--dim);
    border:1px solid #2b3646;border-radius:5px;padding:1px 6px;
    background:transparent;cursor:pointer;
  }
  .author-pop .pop-copy:hover{color:#fff;border-color:var(--accent)}

  /* 纯滞后环节提示条 */
  .delay-note{
    display:none;
    padding:7px 16px;font-size:12px;line-height:1.55;
    background:rgba(255,179,64,.10);
    border-bottom:1px solid rgba(255,179,64,.28);
    color:#ffd9a0;
  }
  .delay-note.show{display:block}
  .delay-note b{color:#ffb340;font-weight:600}

  /* 输入联想下拉。
     关键点：浮层挂在 <body> 上、用 position:fixed 定位，
     而不是作为 .bar 的子元素绝对定位——
     因为窄屏下 .bar 是 overflow-x:auto / overflow-y:hidden 的横向滚动条，
     子元素绝对定位会被它按 overflow 裁掉（实测露出不到 10px）。
     挂到 body 后浮层完全脱离滚动容器，不受任何祖先 overflow 影响。 */
  .ac-wrap{position:relative;display:inline-block}
  .ac-list{
    position:fixed;z-index:200;
    min-width:132px;max-height:186px;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    background:#161b24;
    border:1px solid #2f3a49;border-radius:7px;
    box-shadow:0 8px 22px rgba(0,0,0,.55);
    padding:3px;display:none;
  }
  .ac-list.show{display:block}
  .ac-item{
    display:flex;align-items:center;gap:8px;
    padding:4px 8px;border-radius:5px;cursor:pointer;
    font:13px ui-monospace,Consolas,"Courier New",monospace;
    color:#d8e0ea;white-space:nowrap;
    /* 触屏上长按可能触发选中/放大，这里统一禁止 */
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  .ac-item .ac-sym{font-weight:600;color:#8fd3ff;min-width:42px}
  .ac-item .ac-desc{font-size:11px;color:#7d8899;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
  .ac-item.sel,.ac-item:hover,.ac-item:active{background:#20304a}
  .ac-item:active{background:#2a3d5c}
  /* 触屏专用操作提示 */
  .ac-tip{
    margin-top:3px;padding:5px 8px 3px;
    border-top:1px solid #232b37;
    font:11px "Segoe UI","Microsoft YaHei",sans-serif;
    color:#6b7686;text-align:center;
  }
  .ac-item.sel .ac-sym{color:#fff}

  /* 零极点坐标面板：正常文档流元素，展开时把画布往下推 */
  .zp-panel{    display:none;gap:26px;flex-wrap:wrap;align-items:flex-start;
    padding:9px 16px 11px;background:#10141b;
    border-bottom:1px solid var(--line);
    font-size:12px;flex:0 0 auto;
    max-height:34vh;overflow:auto;
  }
  .zp-panel.open{display:flex}
  .zp-col{min-width:150px;flex:0 1 auto}
  .zp-head{font-size:11px;color:var(--dim);letter-spacing:.4px;margin-bottom:5px}
  .zp-head.poles{color:#ffb340}
  .zp-head.zeros{color:#4fc3f7}
  .zp-list{font:11.5px/1.75 Consolas,"Cascadia Mono",monospace;color:var(--fg)}
  .zp-list .zp-row{display:flex;gap:10px;white-space:nowrap}
  .zp-list .zp-idx{color:var(--dim);min-width:22px}
  .zp-list .zp-polar{color:#8b98a9}
  .zp-meta .zp-list{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:11.5px}
  .zp-meta .zp-list b{color:var(--accent);font-weight:600}

  /* ==========================================================
     手机 / 触屏适配
     ========================================================== */
  /* 触屏设备按钮加大到易点范围（>=44px 是常见推荐值） */
  @media (pointer:coarse){
    .tab{padding:10px 18px;font-size:14px}
    .bar{padding:10px 12px;gap:12px}
    .bar button{padding:9px 14px;font-size:13.5px}
    .bar input[type=text]{width:180px;padding:8px 10px;font-size:13px}
    .bar input[type=number]{padding:8px 8px;font-size:13px;width:74px}
    .vbtns button{width:44px;height:44px;font-size:19px;border-radius:10px}
    .vbtns{right:12px;bottom:12px;gap:8px}
    .legend{height:auto;min-height:26px;padding:3px 10px;font-size:12px}
    .cell > canvas{top:30px;height:calc(100% - 30px)}
    .author-pop{min-width:200px}
    .author-pop .pop-copy{padding:4px 9px;font-size:11.5px}
    /* 输入联想：触屏上加大到易点尺寸。
       行高按 44px 触控目标标定（font 15px + 上下 padding 13px ≈ 47px），
       并限制高度，避免候选多时把浮层撑出屏幕。 */
    .ac-item{padding:13px 12px;font-size:15px;gap:9px;min-height:44px;box-sizing:border-box}
    .ac-item .ac-sym{min-width:26px;font-size:16px}
    .ac-item .ac-desc{font-size:12px}
    .ac-list{max-height:42vh;padding:5px;min-width:150px}
    .ac-tip{font-size:11.5px;padding:6px 8px 4px}
  }

  /* 窄屏：把顶部工具区改为可横向滚动，避免挤成多行占满屏 */
  @media (max-width:720px){
    header{padding:8px 12px;gap:10px}
    h1{font-size:13.5px}
    h1 span{display:none}                     /* 窄屏隐藏副标题，省空间 */
    #tabs{gap:5px}
    .tab{padding:8px 13px;font-size:12.5px}
    .author-avatar{width:32px;height:32px;border-radius:8px}
    .author-badge{font-size:12px}
    .author-tip{font-size:9.5px;letter-spacing:1.5px}

    .bar{
      flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    .bar::-webkit-scrollbar{display:none}
    .bar > *{flex:0 0 auto}
    .bar input[type=text]{width:150px}
    .hint{display:none}                        /* 窄屏隐藏操作提示 */

    .zp-panel{gap:18px;max-height:38vh;padding:8px 12px 10px}
    .zp-col{min-width:132px}

    /* 窄屏无法并排显示两图：改回上下堆叠，各占一半高度。
       并排会让每格只有 180~220px 宽，十倍频程刻度全部糊在一起。 */
    .grid2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  }

  /* 超窄屏（竖屏手机）：进一步压缩 */
  @media (max-width:420px){
    h1{font-size:12.5px}
    .tab{padding:7px 11px;font-size:12px}
    .bar input[type=text]{width:126px;font-size:12.5px}
    .bar input[type=number]{width:64px;font-size:12.5px}
    .vbtns button{width:42px;height:42px;font-size:18px}
    .legend{font-size:11px;gap:10px}
    .zp-col{min-width:118px}
  }

  /* 横屏手机：高度紧张，压缩头部与提示 */
  @media (max-height:520px) and (orientation:landscape){
    header{padding:5px 12px}
    .bar{padding:5px 12px}
    h1 span{display:none}
    .hint{display:none}
    .vbtns{bottom:8px;right:8px}
    .author-avatar{width:30px;height:30px}
  }
</style>
</head>
<body>

<header>
  <h1>根轨迹 / 奈奎斯特·伯德 分析器<span>G(s)H(s) = K·N(s)/D(s)</span></h1>
  <div id="tabs">
    <button class="tab active" data-target="p-rl">根轨迹</button>
    <button class="tab" data-target="p-ny">奈奎斯特 / 伯德</button>

<script>
"use strict";

/* ===========================================================
   多项式：系数一律按【降幂】存放，即 [a_n, ..., a_0]
   =========================================================== */
function pTrim(p){
  let i=0;
  while(i<p.length-1 && Math.abs(p[i])<1e-14) i++;
  return p.slice(i);
}
function pAdd(a,b){                       // 同次项相加
  const n=Math.max(a.length,b.length), o=new Array(n).fill(0);
  for(let i=0;i<n;i++) o[n-1-i]=(a[a.length-1-i]||0)+(b[b.length-1-i]||0);
  return pTrim(o);
}
function pScale(a,k){ return pTrim(a.map(v=>v*k)); }
function pMul(A,B){
  const o=new Array(A.length+B.length-1).fill(0);
  for(let m=0;m<A.length;m++) for(let n=0;n<B.length;n++) o[m+n]+=A[m]*B[n];
  return pTrim(o);
}
function pDeriv(c){                       // 求导（降幂）
  if(c.length<=1) return [0];
  return pTrim(c.slice(0,-1).map((v,i)=>v*(c.length-1-i)));
}

/* 解析多项式字符串：支持 s、数字、+ - * /、括号、^、j */
/* ===========================================================
   表达式解析
   -----------------------------------------------------------
   支持 s、数字、+ - * / ^、括号、j，以及纯滞后环节 e^(-τs)。

   关于延迟环节的处理（重要）：
     e^(-τs) 是超越函数，含它的特征方程 D(s)+K·N(s)e^(-τs)=0
     有无穷多个根，不能用多项式求根。

     本工具的处理方式：
       · 频域（伯德图 / 奈奎斯特图）：直接用 s=jω 代入，
         延迟因子 e^(-jωτ) 幅值为 1、相位为 -ωτ —— 精确，无需近似。
       · 根轨迹：无法计算（超越方程），选中根轨迹时给出明确提示，
         并引导用户改用频域分析。
   =========================================================== */

/* 解析结果：
     { poly:[...],           多项式形式（无延迟时）
       delay:0 或 τ,         纯滞后时间常数
       delayRaw:"" }         延迟的原始写法（用于提示）
   若表达式含延迟，poly 为不含延迟的部分，delay 为 τ。 */
function parsePoly(str){ return parseExpr(str).poly; }

function parseExpr(str){
  let src=String(str||"").replace(/\s+/g,"");
  if(src==="") src="1";
  src=src.replace(/\*\*/g,"^");

  /* 延迟环节在解析前先整体摘出来，避免被当成普通字母处理。
     支持这些写法（^ 可省略，指数可带括号）：
       e^(-2s)   e^(-2*s)   e^(-2s)   e^-2s
       exp(-2s)  exp(-2*s)  exp(-0.5s)
       e^(-s)    exp(-s)                      （省略系数 1）
     用 @@ 占位（不含字母数字，不会被隐式乘法正则拆开），τ 记在 delay 里。 */
  let delay=0, delayRaw="";
  const grabDelay=(m,tau)=>{
    if(!delayRaw) delayRaw=m;
    delay += (tau==="" || tau===undefined) ? 1 : parseFloat(tau);
    return "@@";
  };
  // 1) 带 ^ 且带括号：e^(...) / exp^(...)
  src=src.replace(/(?:exp|e)\s*\^\s*\(\s*-\s*([0-9.]*)\s*\*?\s*s\s*\)/g, grabDelay);
  // 2) 带 ^ 但不带括号：e^-2s / exp^-2s
  src=src.replace(/(?:exp|e)\s*\^\s*-\s*([0-9.]*)\s*\*?\s*s\b/g, grabDelay);
  // 3) exp(...) 不带 ^：exp(-2s) / exp(-0.5s) / exp(-s)
  src=src.replace(/exp\s*\(\s*-\s*([0-9.]*)\s*\*?\s*s\s*\)/g, grabDelay);

  /* 隐式乘法补全。
     先把"科学计数法数字"和"延迟占位符"用临时标记保护起来，
     否则正则会把 1e-3 拆成 1*e-3、把 @@ 拆开。
     处理完再还原。 */
  const sciStore=[];
  // 保护科学计数法：1e-3 / 2.5E8 / 1e+6
  src=src.replace(/\d+(?:\.\d+)?[eE][+\-]?\d+/g, (m)=>{
    sciStore.push(m);
    return "\u0001"+(sciStore.length-1)+"\u0001";
  });
  // 补隐式乘法
  src=src.replace(/(\d|\))@@/g,"$1*@@");           // 2@@ -> 2*@@
  src=src.replace(/@@(?=[a-zA-Z(@\u0001])/g,"@@*"); // @@s -> @@*s
  src=src.replace(/(\d|\))(?=[a-zA-Z(])/g,"$1*");
  src=src.replace(/([a-zA-Z])(?=[a-zA-Z(])/g,"$1*");
  // 还原科学计数法
  src=src.replace(/\u0001(\d+)\u0001/g, (m,idx)=>sciStore[+idx]);

  let i=0;
  const peek=()=>src[i];
  const eat=(ch)=>{ if(src[i]!==ch) throw new Error("位置 "+i+" 期望 "+ch); i++; };

  function div(A,B){
    A=pTrim(A.slice()); B=pTrim(B.slice());
    if(B.length===1) return pTrim(A.map(v=>v/B[0]));
    if(A.length<B.length) throw new Error("分式结果不是多项式（余式非零）");
    const q=new Array(A.length-B.length+1).fill(0);
    for(let k=0;k<q.length;k++){
      const c=A[0]/B[0]; q[k]=c;
      for(let n=0;n<B.length;n++) A[n]-=c*B[n];
      A=A.slice(1);
      if(A.length===0) break;
    }
    if(A.some(v=>Math.abs(v)>1e-9)) throw new Error("分式结果不是多项式（余式非零）");
    return pTrim(q);
  }

  function expr(){
    let v=term();
    while(peek()==="+"||peek()==="-"){
      const op=src[i++]; const r=term();
      v = op==="+" ? pAdd(v,r) : pAdd(v,pScale(r,-1));
    }
    return v;
  }
  function term(){
    let v=unary();
    while(peek()==="*"||peek()==="/"){
      const op=src[i++]; const r=unary();
      v = op==="*" ? pMul(v,r) : div(v,r);
    }
    return v;
  }
  function unary(){
    if(peek()==="+"){ i++; return unary(); }
    if(peek()==="-"){ i++; return pScale(unary(),-1); }
    return power();
  }
  function power(){
    const base=atom();
    if(peek()==="^"){
      i++;
      let e="";
      if(peek()==="("){ i++; while(i<src.length&&src[i]!==")") e+=src[i++]; eat(")"); }
      else {
        // 指数只允许：可选前导负号 + 数字串（可含小数点）。
        // 不能贪婪吞掉后续的 '-'(如 s^2-3s 中的减号)，否则 parseFloat("2-3")
        // 会得到 2 并把 "-3s" 整项丢掉。
        if(peek()==="-") e+=src[i++];
        while(i<src.length && /[0-9.]/.test(src[i])) e+=src[i++];
      }
      const k=parseFloat(e);
      if(!isFinite(k)||k<0||Math.abs(k-Math.round(k))>1e-9) throw new Error("幂次须为非负整数: "+e);
      let o=[1];
      for(let t=0;t<Math.round(k);t++) o=pMul(o,base);
      return pTrim(o);
    }
    return base;
  }
  function atom(){
    if(peek()==="("){ i++; const v=expr(); eat(")"); return v; }
    // 延迟占位符：数学上相当于常数 1（延迟已单独记录在 delay 中）
    if(src.startsWith("@@",i)){ i+=2; return [1]; }
    if(peek()==="s"){ i++; return [1,0]; }
    if(peek()==="j"){ i++; return [1e-12,1]; }
    if(peek()!==undefined && /[0-9.]/.test(peek())){
      let s="";
      // 科学计数法状态机：数字段 -> (e/E) -> 可选符号 -> 指数数字段
      // 只有"e/E 后面紧跟数字或 +/-数字"才算科学计数法；
      // 否则 e 属于延迟项（如 2e^(-2s)），留给后面的 @@ 处理。
      let seenE=false, seenSign=false;
      while(i<src.length){
        const ch=src[i];
        if(/[0-9]/.test(ch)){ s+=ch; i++; continue; }
        if(ch==="." && !seenE){ s+=ch; i++; continue; }
        if((ch==="e"||ch==="E") && !seenE && s.length>0 && /[0-9.]/.test(s[s.length-1])){
          const n1=src[i+1]||"";
          if(/[0-9]/.test(n1)){ s+=ch; i++; seenE=true; continue; }
          if((n1==="+"||n1==="-") && /[0-9]/.test(src[i+2]||"")){
            s+=ch; i++; seenE=true; continue;
          }
        }
        if((ch==="+"||ch==="-") && seenE && !seenSign && s.length>0){
          const prev=s[s.length-1];
          if(prev==="e"||prev==="E"){ s+=ch; i++; seenSign=true; continue; }
        }
        break;
      }
      const v=parseFloat(s);
      if(!isFinite(v)) throw new Error("非法数字: "+s);
      return [v];
    }
    throw new Error("位置 "+i+" 无法解析: '"+(src[i]||"EOF")+"'");
  }

  const res=expr();
  if(i<src.length) throw new Error("多余字符: "+src.slice(i));
  return { poly:pTrim(res), delay, delayRaw };
}

/* 精确频率响应中的延迟因子：G(jω) 再乘 e^(-jωτ)。
   幅值恒为 1（不衰减），相位附加 -ωτ。
   这是解析精确值，伯德图与奈奎斯特图都用它，无需任何近似。 */
function applyDelayToFreq(H, w, tau){
  if(!tau) return H;
  const ph=-w*tau;
  return {
    re: H.re*Math.cos(ph) - H.im*Math.sin(ph),
    im: H.re*Math.sin(ph) + H.im*Math.cos(ph),
    mag: H.mag,                              // |e^(-jωτ)| = 1
    ph: H.ph + ph
  };
}

/* ===========================================================
   复系数多项式求根：Aberth–Ehrlich 迭代
   =========================================================== */
function csqrt(z){
  const r=Math.hypot(z.re,z.im);
  const re=Math.sqrt(Math.max(0,(r+z.re)/2));
  const im=Math.sqrt(Math.max(0,(r-z.re)/2))*(z.im<0?-1:1);
  return {re,im};
}
/* 用 Aberth–Ehrlich 求首一多项式 a 的全部根（a 按降幂）。
   初值取 Cauchy 界圆上的等分点：该圆包含所有根，标准做法收敛可靠。 */
function abFindAll(a){
  const n=a.length-1;
  if(n<1) return [];
  const pv=(z)=>{
    let re=0,im=0;
    for(let k=0;k<a.length;k++){
      const co=a[k];
      const nr=re*z.re-im*z.im+co, ni=re*z.im+im*z.re;
      re=nr; im=ni;
    }
    return {re,im};
  };
  const dv=(z)=>{
    let re=0,im=0;
    for(let k=0;k<a.length-1;k++){
      const co=a[k]*(a.length-1-k);
      const nr=re*z.re-im*z.im+co, ni=re*z.im+im*z.re;
      re=nr; im=ni;
    }
    return {re,im};
  };
  // Cauchy 界：所有根满足 |z| < bound
  let bound=0;
  for(let k=1;k<a.length;k++) bound=Math.max(bound, Math.abs(a[k]));
  bound=Math.max(1, bound+1);

  const z=[];
  for(let k=0;k<n;k++){
    const th=2*Math.PI*(k+0.5)/n;          // 半格偏移，避免初值落在实轴上
    z.push({re:bound*Math.cos(th), im:bound*Math.sin(th)});
  }
  for(let it=0;it<500;it++){
    let maxd=0;
    for(let i=0;i<n;i++){
      const zi=z[i];
      const P=pv(zi), D=dv(zi);
      const pm=P.re*P.re+P.im*P.im;
      if(pm<1e-300) continue;
      let sr=0,si=0;
      for(let j=0;j<n;j++){
        if(j===i) continue;
        const dr=zi.re-z[j].re, di=zi.im-z[j].im;
        const dd=dr*dr+di*di;
        if(dd<1e-300){ sr=0; si=0; break; }   // 两点重合，跳过这一步的排斥项
        sr+=dr/dd; si-=di/dd;
      }
      const ur=(D.re*P.re+D.im*P.im)/pm, ui=(D.im*P.re-D.re*P.im)/pm;
      const qr=ur-sr, qi=ui-si;
      const qq=qr*qr+qi*qi;
      if(qq<1e-300) continue;
      const dr2=qr/qq, di2=-qi/qq;
      zi.re-=dr2; zi.im-=di2;
      maxd=Math.max(maxd,Math.hypot(dr2,di2));
    }
    if(maxd<1e-14*bound) break;
  }
  return z;
}

/* 实系数多项式（降幂，a[0] 已首一化）求全部根。
   策略：Aberth–Ehrlich 一次得到全部根的初值并精修；
   再做“去重 + 按需补充”，避免根坍缩导致丢根。 */
function rootsRealCoef(cf){
  if(cf.length<=1) return [];
  const a=cf.map(v=>v/cf[0]);
  const deg=a.length-1;
  if(deg===1) return [{re:-a[1], im:0}];
  if(deg===2){
    const b=a[1], c=a[2];
    const disc=b*b-4*c;
    if(disc>=0){
      const s=Math.sqrt(disc);
      return [{re:(-b+s)/2,im:0},{re:(-b-s)/2,im:0}];
    }
    const s=Math.sqrt(-disc);
    return [{re:-b/2, im:s/2},{re:-b/2, im:-s/2}];
  }

  const pv=(z)=>{
    let re=0,im=0;
    for(const co of a){ const nr=re*z.re-im*z.im+co, ni=re*z.im+im*z.re; re=nr; im=ni; }
    return {re,im};
  };
  const newton=(z0)=>{
    let z={re:z0.re, im:z0.im};
    for(let it=0;it<200;it++){
      const P=pv(z);
      let dre=0,dim=0;
      for(let k=0;k<a.length-1;k++){
        const co=a[k]*(a.length-1-k);
        const nr=dre*z.re-dim*z.im+co, ni=dre*z.im+dim*z.re;
        dre=nr; dim=ni;
      }
      const dq=dre*dre+dim*dim;
      if(dq<1e-300) break;
      const qr=(P.re*dre+P.im*dim)/dq, qi=(P.im*dre-P.re*dim)/dq;
      z.re-=qr; z.im-=qi;
      if(Math.hypot(qr,qi)<1e-16) break;
    }
    if(Math.abs(z.im)<1e-9) z.im=0;
    return z;
  };

  // 1) 用 Aberth 得到一批初值
  let seeds=abFindAll(a);

  // 2) 逐个牛顿精修，并去重
  const roots=[];
  const pushUnique=(z)=>{
    if(!isFinite(z.re)||!isFinite(z.im)) return;
    if(roots.some(o=>Math.hypot(o.re-z.re,o.im-z.im)<1e-7*Math.max(1,Math.abs(z.re)))) return;
    roots.push(z);
  };
  seeds.forEach(s=>pushUnique(newton(s)));

  // 3) 补根：在未覆盖区域撒扰动初值，直到凑够 deg 个互不相同的根
  if(roots.length<deg){
    let bound=1;
    for(let k=1;k<a.length;k++) bound=Math.max(bound, Math.abs(a[k])+1);
    const extra=[];
    for(let ring=0;ring<8 && roots.length+extra.length<deg;ring++){
      const R=bound*(0.15+0.2*ring);
      const M=Math.max(8, deg*4);
      for(let k=0;k<M;k++){
        const th=2*Math.PI*k/M + ring*0.37;
        extra.push({re:R*Math.cos(th), im:R*Math.sin(th)});
      }
    }
    for(const e of extra){
      if(roots.length>=deg) break;
      const z=newton(e);
      if(Math.hypot(pv(z).re,pv(z).im)>1e-7*Math.max(1,Math.abs(a[0]))) continue;
      pushUnique(z);
    }
  }

  // 4) 若仍不足（重根情形），把 Aberth 结果直接补上
  if(roots.length<deg){
    for(const s of seeds){
      if(roots.length>=deg) break;
      const z=Math.abs(s.im)<1e-9?{re:s.re,im:0}:s;
      if(!isFinite(z.re)||!isFinite(z.im)) continue;
      roots.push(z);
    }
  }
  return roots.slice(0,deg);
}

// 降幂实系数多项式求根（供根轨迹使用）
function rootsOfPolyReal(cIn){
  const c=pTrim(cIn.slice());
  if(c.length<=1) return [];
  if(Math.abs(c[0])<1e-300) return [];
  return rootsRealCoef(c)
    .filter(v=>isFinite(v.re)&&isFinite(v.im))
    .map(v=>({re:Math.abs(v.re)<1e-12?0:v.re, im:Math.abs(v.im)<1e-12?0:v.im}));
}

/* ===========================================================
   根轨迹：K 扫掠 + 最近邻分支续接
   =========================================================== */
function rootsOfCharPoly(Nc,Dc,K){
  const c=pTrim(pAdd(Dc.slice(), Nc.map(v=>v*K)));   // D(s)+K·N(s)
  if(c.length<=1) return [];
  return rootsOfPolyReal(c);
}

/* 求某一 K 下所有闭环极点，并保证顺序与 prev 连续。
   用最小总代价的指派（贪心 + 2-opt 改进），而不是纯最近邻：
   纯最近邻在多根聚拢时会配对错位，让某条支跳到另一条支上。
   返回 null 表示根数不足（数值失败）。 */
function matchRoots(prev, cur){
  const n = prev.length;
  if (n !== cur.length) return cur;
  const cost = (a, b) =>
    (prev[a].re - cur[b].re) ** 2 + (prev[a].im - cur[b].im) ** 2;
  const pairs = [];
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
    if (!prev[a] || !cur[b]) continue;
    pairs.push([cost(a, b), a, b]);
  }
  pairs.sort((x, y) => x[0] - y[0]);
  const mapA = new Array(n).fill(null), usedB = new Array(n).fill(false);
  for (const [, a, b] of pairs) {
    if (mapA[a] !== null || usedB[b]) continue;
    mapA[a] = b; usedB[b] = true;
  }
  // 2-opt：交换配对若降低总代价则交换，避免局部最优造成的错位
  const total = () => { let s = 0; for (let a = 0; a < n; a++) if (mapA[a] !== null) s += cost(a, mapA[a]); return s; };
  let improved = true, guard = 0;
  while (improved && guard++ < 8) {
    improved = false;
    for (let a1 = 0; a1 < n; a1++) for (let a2 = a1 + 1; a2 < n; a2++) {
      const b1 = mapA[a1], b2 = mapA[a2];
      if (b1 === null || b2 === null) continue;
      if (cost(a1, b2) + cost(a2, b1) < cost(a1, b1) + cost(a2, b2) - 1e-12) {
        mapA[a1] = b2; mapA[a2] = b1; improved = true;
      }
    }
  }
  const ordered = [];
  for (let a = 0; a < n; a++) ordered.push(mapA[a] !== null ? cur[mapA[a]] : null);
  return ordered;
}

function polesAt(Nc,Dc,K,prev,n){
  let r=rootsOfCharPoly(Nc,Dc,K);
  if(r.length<n) return null;
  if(prev && prev.length===r.length){
    r=matchRoots(prev, r);
  }
  return r;
}
/* 解析求分离点/会合点（含复平面上的）。
   满足 dK/ds = 0，其中 K(s) = -D(s)/N(s)，故等价于
       N(s)·D'(s) − N'·D(s) = 0
   解出该方程的根后，只保留 K 的符号与 kSign 一致的解：
     kSign>0 取 Kr>0 的点（K 由 0 增大时的分离点）
     kSign<0 取 Kr<0 的点（K 由 0 减小时的分离点）
   返回 [{s:{re,im}, K}]，K 为在该分支上使用的“绝对”增益 |Kr|。 */
function breakawayPoints(Nc,Dc,kSign){
  const sgn = kSign<0 ? -1 : 1;
  const Np=pDeriv(Nc), Dp=pDeriv(Dc);
  let eq=pAdd(pMul(Nc,Dp), pScale(pMul(Np,Dc),-1));   // N·D' − N'·D
  eq=pTrim(eq);
  if(eq.length<=1) return [];
  const roots=rootsOfPolyReal(eq);
  const out=[];
  for(const r of roots){
    // K = -D(s)/N(s)
    const Nd=evalComplex(Nc,r), Dd=evalComplex(Dc,r);
    const den=Nd.re*Nd.re+Nd.im*Nd.im;
    if(den<1e-300) continue;                            // N(s)=0，不是分离点
    const Kr=-(Dd.re*Nd.re+Dd.im*Nd.im)/den;
    // 虚部校验：分离点必须对应实增益
    const Ki=((Dd.im*Nd.re-Dd.re*Nd.im))/den;
    if(Math.abs(Ki)>1e-6*Math.max(1,Math.abs(Kr))) continue;
    // 符号校验：只保留与当前分支（kSign）一致的点
    if(sgn>0 && Kr<=1e-12) continue;
    if(sgn<0 && Kr>=-1e-12) continue;
    // 校验该点确为特征方程的根（用带符号的 K）
    const check=evalComplex(pAdd(Dc.slice(), Nc.map(v=>v*Kr)), r);
    if(Math.hypot(check.re,check.im)>1e-6) continue;
    out.push({s:{re:r.re, im:r.im}, K:Math.abs(Kr)});   // K 统一存绝对值
  }
  return out;
}
function krOutOfRange(K){ return !isFinite(K) || K<0; }
// 复系数多项式在复点求值（Horner）
function evalComplex(c,z){
  let re=0,im=0;
  for(const co of c){
    const nr=re*z.re-im*z.im+co, ni=re*z.im+im*z.re;
    re=nr; im=ni;
  }
  return {re,im};
}

/* 自适应 K 扫掠：
   kSign 决定 K 取正还是负；轨迹形状对 K 的符号敏感，故由调用方传入。 */
function computeRootLocus(Nc,Dc,kSign,Kmax,NK){
  kSign = kSign<0 ? -1 : 1;
  const n=Math.max(Dc.length-1, Nc.length-1);
  // 粗扫 K 取值：几何级数（低 K 更密）+ 解析分离点处的 K（精确落在折返点上）
  const ratioSet=new Set();
  for(let i=0;i<=NK;i++){
    const t=i/NK;
    ratioSet.add(t===0 ? 0 : Math.pow(t,3));
  }
  ratioSet.add(1);
  // 把分离点/会合点的 K 精确插入，避免折返处被整段跳过
  const bps=breakawayPoints(Nc,Dc,kSign);
  bps.forEach(bp=>{
    const t=Math.pow(Math.min(1, bp.K/Kmax), 1/3);   // 反解 t（与上面的 t^3 对应）
    ratioSet.add(t);
    // 折返点两侧再各加一档，让尖角形状圆顺
    ratioSet.add(Math.max(0, t-Math.abs(t)*0.02-1e-9));
    ratioSet.add(Math.min(1, t+Math.abs(t)*0.02+1e-9));
  });
  const ratios=[...ratioSet].sort((a,b)=>a-b);

  const evalK=(K,prev)=>{
    return polesAt(Nc,Dc,kSign*K,prev,n);
  };

  // 粗扫
  const pts=[];
  let prev=null;
  for(const t of ratios){
    const K=t*Kmax;
    const r=evalK(K,prev);
    if(!r) continue;
    pts.push({K, r});
    prev=r;
  }
  if(!pts.length) return Array.from({length:n},()=>[]);

  // 自适应细分：相邻采样点位移过大就插入中点（递归深度受限）。
  // 阈值取“每段自身尺度”的极小值：轨迹远处步子大、近处步子小，
  // 若用全局跨度做阈值，分离点/会合点这种局部特征会被整段跳过。
  const out=[pts[0]];
  const REL=0.006;                              // 相对本段位移的比例阈值（越小越密）
  const ABS_MIN=1e-5;                           // 绝对下限，避免无限细分

  const subdivide=(p0,p1,depth)=>{
    if(depth<=0) return;
    let maxMove=0;
    for(let b=0;b<n;b++){
      if(!p0.r[b]||!p1.r[b]) continue;
      maxMove=Math.max(maxMove, Math.hypot(p1.r[b].re-p0.r[b].re, p1.r[b].im-p0.r[b].im));
    }
    // 本段两端点到原点的尺度，作为局部参考尺寸
    let scale=0;
    for(let b=0;b<n;b++){
      if(p0.r[b]) scale=Math.max(scale, Math.hypot(p0.r[b].re,p0.r[b].im));
      if(p1.r[b]) scale=Math.max(scale, Math.hypot(p1.r[b].re,p1.r[b].im));
    }
    scale=Math.max(scale, 1);
    // 判据：本段位移相对局部尺度足够小则接受；同时给出绝对下限
    if(maxMove < Math.max(scale*REL, ABS_MIN)) return;
    // K 变化的中间值若与端点重合则无法再分
    const Kmid=(p0.K+p1.K)/2;
    if(Kmid<=p0.K || Kmid>=p1.K) return;
    const rmid=evalK(Kmid,p0.r);
    if(!rmid) return;
    const mid={K:Kmid, r:rmid};
    subdivide(p0,mid,depth-1);
    out.push(mid);
    subdivide(mid,p1,depth-1);
  };
  // 逐段展开：每段先细分前半，再压入该段终点
  for(let i=1;i<pts.length;i++){
    subdivide(pts[i-1], pts[i], 20);
    out.push(pts[i]);
  }

  // 注：分离点/会合点的 K 已作为采样点加入（见上），此处不再额外插入
  // 乱序的根集合——那样会打断分支链的顺序，导致某条支跳到另一条支上。

  // 按 K 排序并展开成分支
  out.sort((a,b)=>a.K-b.K);
  const branches=Array.from({length:n},()=>[]);

  /* 分支续接：分支在"会合/分离"处会发生拓扑变化（两条实支合并成共轭复支），
     此时单纯用"到上一点距离"或"速度外推"都可能错配，画出横贯画面的假线。
     这里对每个候选配对评估两件事，再取全局最小总代价：
       1) 与上一点的距离（基础约束，任何情况下都要求连续）
       2) 与预测点的距离（平滑性，仅作为次要加权，且在折返处自动减弱）
     关键是第 2 项权重很小（0.25）：折返点附近速度方向会突变，
     过度信赖外推反而会造成错配。 */
  let chainPrev=null;      // 上一组已排序的根
  let chainPrevPrev=null;  // 上上组，用于估计速度
  for(const p of out){
    let r=p.r;
    if(chainPrev){
      const pred=[];
      for(let a=0;a<n;a++){
        const c0=chainPrev[a], c1=chainPrevPrev?chainPrevPrev[a]:null;
        if(!c0){ pred.push(null); continue; }
        pred.push(c1 ? {re:c0.re+(c0.re-c1.re), im:c0.im+(c0.im-c1.im)} : null);
      }
      const cost=(a,b)=>{
        const dRaw=(chainPrev[a].re-r[b].re)**2+(chainPrev[a].im-r[b].im)**2;
        if(!pred[a]) return dRaw;
        const dPred=(pred[a].re-r[b].re)**2+(pred[a].im-r[b].im)**2;
        return dRaw + 0.25*dPred;
      };
      const pairs=[];
      for(let a=0;a<n;a++)for(let b=0;b<n;b++){
        if(!chainPrev[a]||!r[b]) continue;
        pairs.push([cost(a,b), a, b]);
      }
      pairs.sort((x,y)=>x[0]-y[0]);
      let mapA=new Array(n).fill(null), usedB=new Array(n).fill(false);
      for(const [,a,b] of pairs){
        if(mapA[a]!==null||usedB[b]) continue;
        mapA[a]=b; usedB[b]=true;
      }
      // 2-opt：交换配对若降低总代价则交换
      let improved=true, guard=0;
      while(improved && guard++<10){
        improved=false;
        for(let a1=0;a1<n;a1++)for(let a2=a1+1;a2<n;a2++){
          const b1=mapA[a1], b2=mapA[a2];
          if(b1===null||b2===null) continue;
          if(cost(a1,b2)+cost(a2,b1) < cost(a1,b1)+cost(a2,b2)-1e-12){
            mapA[a1]=b2; mapA[a2]=b1; improved=true;
          }
        }
      }
      const ordered=[];
      for(let a=0;a<n;a++) ordered.push(mapA[a]!==null?r[mapA[a]]:null);
      r=ordered;
    }
    for(let b=0;b<n;b++) if(r[b]) branches[b].push({K:p.K, re:r[b].re, im:r[b].im});
    chainPrevPrev=chainPrev;
    chainPrev=r;
  }
  return branches;
}

/* ===========================================================
   频域响应
   =========================================================== */
function polyVal(c,w){                    // s=jw 处取值
  let re=0,im=0;
  for(let i=0;i<c.length;i++){
    const ord=c.length-1-i, co=c[i];
    const p=Math.pow(w,ord);
    if(ord%4===0) re+=co*p;
    else if(ord%4===1) im+=co*p;
    else if(ord%4===2) re-=co*p;
    else im-=co*p;
  }
  return {re,im};
}
function freqResponse(Nc,Dc,w){
  const N=polyVal(Nc,w), D=polyVal(Dc,w);
  const dd=D.re*D.re+D.im*D.im;
  if(dd<1e-300) return {re:Infinity,im:Infinity,mag:Infinity,ph:NaN};
  return {
    re:(N.re*D.re+N.im*D.im)/dd,
    im:(N.im*D.re-N.re*D.im)/dd,
    mag:Math.hypot(N.re,N.im)/Math.sqrt(dd),
    ph:Math.atan2(N.im,N.re)-Math.atan2(D.im,D.re)
  };
}
/* 频率响应：可带纯滞后环节。
   tau>0 时在 G(jω) 上乘 e^(-jωτ)（幅值不变、相位 -ωτ）。
   相位先做解缠绕再叠加延迟相位，避免延迟引起的大幅跳变被误判。 */
function buildFreqPoints(Nc,Dc,w1,w2,nPts,tau){
  const pts=[];
  const l1=Math.log10(Math.max(w1,1e-8));
  const l2=Math.log10(Math.max(w2,Math.max(w1,1e-8)*1.0001));
  for(let i=0;i<=nPts;i++){
    const w=Math.pow(10, l1+(l2-l1)*i/nPts);
    let H=freqResponse(Nc,Dc,w);
    if(!isFinite(H.mag)) continue;
    // 先对无延迟部分做相位连续化
    let ph=H.ph;
    if(pts.length){
      const last=pts[pts.length-1].ph;
      while(ph-last>Math.PI) ph-=2*Math.PI;
      while(ph-last<-Math.PI) ph+=2*Math.PI;
    }
    // 再叠加延迟：G(jω)·e^(-jωτ)。
    // 注意实部/虚部也要按 -ωτ 旋转——奈奎斯特图用的是直角坐标，
    // 只改相位而不同步旋转 re/im 会导致幅相频曲线与伯德图不一致。
    if(tau){
      const dph=-w*tau;
      const cs=Math.cos(dph), sn=Math.sin(dph);
      const re2=H.re*cs - H.im*sn;
      const im2=H.re*sn + H.im*cs;
      H={re:re2, im:im2, mag:H.mag, ph:H.ph+dph};
      ph += dph;
    }
    pts.push({w, re:H.re, im:H.im, mag:H.mag, ph});
  }
  return pts;
}

/* ===========================================================
   绘图工具
   =========================================================== */
const FONTSM='11px "Segoe UI","Microsoft YaHei",sans-serif';
const ARROW_COLOR='#e60012';

function setupCanvas(cv){
  const dpr=Math.min(3, Math.max(1, window.devicePixelRatio||1));
  // 上限保护：canvas 位图有尺寸上限，异常布局一旦算出超大尺寸会直接失败。
  // 这里把逻辑尺寸夹在合理区间，避免整页白屏。
  const MAXW=8192, MAXH=8192;
  const w=Math.min(MAXW, Math.max(1, Math.round(cv.clientWidth||0)));
  const h=Math.min(MAXH, Math.max(1, Math.round(cv.clientHeight||0)));
  const bw=Math.min(MAXW, Math.max(1, Math.round(w*dpr)));
  const bh=Math.min(MAXH, Math.max(1, Math.round(h*dpr)));
  if(cv.width!==bw||cv.height!==bh){ cv.width=bw; cv.height=bh; }
  const ctx=cv.getContext("2d");
  if(!ctx) return {ctx:null, W:w, H:h, w, h};
  ctx.setTransform(bw/w, 0, 0, bh/h, 0, 0);
  ctx.fillStyle="#0e1116";
  ctx.fillRect(0,0,w,h);
  // 返回 W/H（调用方按大写解构）；同时保留 w/h 以兼容
  return {ctx, W:w, H:h, w, h};
}
function clearCanvas(cv){
  const ctx=cv.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
}
function niceStep(range,target){
  const raw=range/target, e=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/e;
  return (f<1.5?1:f<3?2:f<7?5:10)*e;
}
function fmt(v,step){
  const d=Math.max(0,Math.ceil(-Math.log10(step)));
  let s=v.toFixed(Math.min(6,d));
  if(s==="-0") s="0";
  return s;
}
function sig3(v){
  if(!isFinite(v)) return String(v);
  if(v===0) return "0";
  const a=Math.abs(v);
  if(a>=1e4||a<1e-3) return v.toExponential(1);
  return String(parseFloat(v.toPrecision(3)));
}
/* 复数坐标标签，如 "-2"、"-1+2j"、"0"、"-0.5-1.5j" */
function fmtComplex(r){
  const re=parseFloat(r.re.toPrecision(4));
  const im=parseFloat(r.im.toPrecision(4));
  const rs=(Object.is(re,-0)?"0":String(re));
  if(Math.abs(im)<1e-9) return rs;                 // 实根
  const imAbs=Math.abs(im);
  // 始终写出数字（-1−2j、0+1j），避免 "0+j" 这种含混写法
  const imStr=String(Object.is(imAbs,-0)?0:imAbs);
  // 实部为 0 时省略前导 "0+"，直接写 "5j" / "−5j"，更接近手写习惯
  if(Math.abs(re)<1e-9) return (im>0?"":'−')+imStr+"j";
  return rs + (im>0?"+":"−") + imStr + "j";
}
/* 极坐标形式，用于零极点列表，如 "2.236∠116.6°" */
function fmtPolar(r){
  const mag=Math.hypot(r.re,r.im);
  const ang=Math.atan2(r.im,r.re)*180/Math.PI;
  return parseFloat(mag.toPrecision(4))+"∠"+parseFloat(ang.toPrecision(4))+"°";
}

/* 沿折线按弧长等分画方向箭头
   pts:[{x,y}] 已是像素坐标；flag<0 时箭头方向取反 */
function drawFlowArrows(ctx,pts,flag,color,count){
  if(!pts||pts.length<3) return;
  const cum=[0];
  for(let i=1;i<pts.length;i++){
    cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
  }
  const total=cum[cum.length-1];
  if(!(total>8)) return;
  const n=Math.max(1, count || Math.min(6,Math.max(1,Math.floor(total/110))));
  const size=9;
  for(let k=0;k<n;k++){
    const target=total*((k+0.5)/n);
    let i=1;
    while(i<cum.length-1 && cum[i]<target) i++;
    const seg=cum[i]-cum[i-1];
    const u=seg>1e-9?(target-cum[i-1])/seg:0;
    const px=pts[i-1].x+(pts[i].x-pts[i-1].x)*u;
    const py=pts[i-1].y+(pts[i].y-pts[i-1].y)*u;
    const a=Math.max(0,i-2), b=Math.min(pts.length-1,i+1);
    let dx=pts[b].x-pts[a].x, dy=pts[b].y-pts[a].y;
    const L=Math.hypot(dx,dy);
    if(L<1e-6) continue;
    dx/=L; dy/=L;
    const s=flag<0?-1:1;
    const ax=dx*s, ay=dy*s;
    ctx.save();
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(px+ax*size*0.55, py+ay*size*0.55);
    ctx.lineTo(px-ax*size*0.45-ay*size*0.36, py-ay*size*0.45+ax*size*0.36);
    ctx.lineTo(px-ax*size*0.45+ay*size*0.36, py-ay*size*0.45-ax*size*0.36);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

/* 复平面网格 + 坐标系 */
function drawComplexGrid(ctx,m,iw,ih,view,map){
  const step=niceStep(2*view.half,7);
  const x0=view.cx-view.half, x1=view.cx+view.half;
  const y0=view.cy-view.half, y1=view.cy+view.half;
  ctx.save();
  ctx.strokeStyle="#1b222c"; ctx.lineWidth=1; ctx.font=FONTSM; ctx.fillStyle="#7f8b9b";
  for(let gx=Math.ceil(x0/step)*step; gx<=x1+1e-12; gx+=step){
    const p=map(gx,y0);
    ctx.beginPath(); ctx.moveTo(p.x,m.t); ctx.lineTo(p.x,m.t+ih); ctx.stroke();
    ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillText(fmt(gx,step), p.x, m.t+ih+5);
  }
  for(let gy=Math.ceil(y0/step)*step; gy<=y1+1e-12; gy+=step){
    const p=map(x0,gy);
    ctx.beginPath(); ctx.moveTo(m.l,p.y); ctx.lineTo(m.l+iw,p.y); ctx.stroke();
    ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillText(fmt(gy,step), m.l-7, p.y);
  }
  ctx.restore();
  ctx.save();
  ctx.strokeStyle="#6d7a8c"; ctx.lineWidth=1.4;
  const o=map(0,0);
  ctx.beginPath(); ctx.moveTo(m.l,o.y); ctx.lineTo(m.l+iw,o.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(o.x,m.t); ctx.lineTo(o.x,m.t+ih); ctx.stroke();
  ctx.restore();
}

/* ===========================================================
   状态
   =========================================================== */
const state={
  Nc:null, Dc:null,
  kSign:1,          // K 的符号
  wSign:1,          // ω 的符号（决定幅相频箭头方向）
  w1:0.01, w2:1000,
  tab:"p-rl",
  rl:{view:null, data:null},
  ny:{view:null, data:null},
  /* 伯德图显示方式：
     "split"   = 上幅频、下相频（两格分开，默认）
     "merged"  = 幅频与相频叠加在同一张图（双纵轴）
     mix 是融合动画的进度 0→1：0 完全分离，1 完全合并。
     用连续插值让两种状态之间的切换有平滑过渡，而不是硬切。 */
  bode:{ mode:"split", mix:0, animating:false }
};

const M_RL_BASE={l:56,r:24,t:34,b:38};   // t 留出图例条高度，避免坐标标注与图例重叠
const M_POL_BASE={l:44,r:20,t:38,b:32};  // t 加大，顶部留出图例条，避免与曲线标注重叠
// 实际使用的边距（会随画布尺寸自适应更新，见 syncMargins）
const M_RL={...M_RL_BASE};
const M_POL={...M_POL_BASE};

/* 依据画布尺寸更新 M_RL / M_POL。
   手机窄屏上固定边距会吃掉太多绘图区，这里按比例收缩。
   之所以就地更新而不是每个函数多传参数，是为了让依赖这两个常量的
   标注、图例、网格等代码无需改动。 */
function syncMargins(){
  const cvRL=document.getElementById("cv-rl");
  const cvP=document.getElementById("cv-pol");
  // 第一次调用时记录基准值
  if(!M_RL.__base) M_RL.__base={...M_RL};
  if(!M_POL.__base) M_POL.__base={...M_POL};
  const setBase=(o,cv)=>{
    const w=cv?cv.clientWidth:999, h=cv?cv.clientHeight:999;
    const narrow = w<520 || h<300;
    if(!narrow){ Object.assign(o,o.__base); return; }   // 宽屏恢复基准
    const sx = w<380 ? 0.68 : 0.78;                     // 越窄收缩越多
    o.l=Math.round(o.__base.l*sx); o.r=Math.round(o.__base.r*sx);
    o.t=Math.round(o.__base.t*0.78); o.b=Math.round(o.__base.b*0.85);
  };
  setBase(M_RL, cvRL);
  setBase(M_POL, cvP);
}

/* 自动视野：目标是“恰好包含所有零极点，并凸显局部特征（分离点等）”。
   若按轨迹全局最大范围取景，K 很大时轨迹会伸到很远，把原点的
   零极点挤成一团。因此以零极点为主体，轨迹只按分位数纳入，
   远端仅作延伸示意。 */
function fitRootLocus(branches,Nc,Dc){
  const zeros=rootsOfPolyReal(Nc), poles=rootsOfPolyReal(Dc);
  let xmin=0,xmax=0,ymin=0,ymax=0;        // 原点务必可见（虚轴/实轴）
  const push=(x,y)=>{
    if(!isFinite(x)||!isFinite(y)) return;
    if(Math.abs(x)>1e12||Math.abs(y)>1e12) return;
    xmin=Math.min(xmin,x); xmax=Math.max(xmax,x);
    ymin=Math.min(ymin,y); ymax=Math.max(ymax,y);
  };
  // 1) 零极点：必须完整可见（主体）
  zeros.forEach(r=>push(r.re,r.im));
  poles.forEach(r=>push(r.re,r.im));

  // 2) 轨迹：先看零极点已经确定的尺度，再决定纳入多少轨迹
  const zpSpan=Math.max(xmax-xmin, ymax-ymin, 1e-6);
  // 收集所有轨迹点的到原点距离，取分位数以内者纳入
  const dists=[];
  branches.forEach(br=>br.forEach(p=>{
    const d=Math.hypot(p.re,p.im);
    if(isFinite(d)) dists.push(d);
  }));
  let allowed=zpSpan*2.2;                  // 至少给零极点尺度 2.2 倍，体现趋势
  if(dists.length){
    dists.sort((a,b)=>a-b);
    // 取 92% 分位：排除最远端的长尾，避免视野被撑爆
    const q=dists[Math.min(dists.length-1, Math.floor(dists.length*0.92))];
    if(isFinite(q)&&q>0) allowed=Math.max(zpSpan*2.2, Math.min(q, zpSpan*6));
  }
  branches.forEach(br=>br.forEach(p=>{
    if(Math.hypot(p.re,p.im)<=allowed) push(p.re,p.im);
  }));

  const span=Math.max(xmax-xmin, ymax-ymin, 1e-6);
  const pad=span*0.14;
  const cx=(xmin+xmax)/2, cy=(ymin+ymax)/2;
  const half=Math.max((xmax-xmin)/2+pad, (ymax-ymin)/2+pad);
  return {cx,cy,half,zeros,poles};
}

function rlMap(cv,view){
  const W=cv.clientWidth,H=cv.clientHeight;
  const iw=W-M_RL.l-M_RL.r, ih=H-M_RL.t-M_RL.b;
  const k=Math.min(iw,ih)/(2*view.half);   // 等比映射，保直角形状
  const map=(x,y)=>({x:M_RL.l+iw/2+(x-view.cx)*k, y:M_RL.t+ih/2-(y-view.cy)*k});
  return {iw,ih,k,map,W,H};
}

/* 零极点：画出符号并在旁边标注坐标。
   难点是多个零极点常常共线且靠得很近（如 s(s+2)(s+5) 的三个极点都在实轴上），
   标签必须错开行才不至于互相压住。
   策略：为每个标签枚举多个候选位置，按"不与已放置标签重叠 + 不遮挡其它零极点"
   依次试探。 */
function drawZeroPoleLabels(ctx, list, type, map, placedLabels, iw, ih){
  const others = [];   // 所有零极点位置，用于避免标签压住它们
  ctx.save();
  // 坐标标注用等宽、稍大、半粗的字体：数字对齐好看，缩放下也清晰
  ctx.font="600 12px Consolas,\"Cascadia Mono\",\"Microsoft YaHei\",monospace";
  list.forEach(r=>{
    if(Math.abs(r.re)>1e7) return;
    others.push(map(r.re,r.im));
  });

  /* 按屏幕 x 从左到右处理，让相邻的零极点依次"认领"不同的行，
     这样共线的多个零极点也能各占一行、互不遮挡。 */
  const items = list
    .filter(r=>Math.abs(r.re)<=1e7)
    .map(r=>({ r, q: map(r.re,r.im) }))
    .sort((A,B)=>A.q.x-B.q.x);

  items.forEach(({r,q})=>{
    const txt=fmtComplex(r);
    const color=type==="pole"?"#ffd98a":"#a5e2ff";
    const w=ctx.measureText(txt).width+10, h=16;

    const mkBox=(tx,ty,al,bl)=>{
      const x0 = al==="left"? tx : al==="right"? tx-w : tx-w/2;
      const y0 = bl==="bottom"? ty-h : ty;
      return {x0,y0,x1:x0+w,y1:y0+h};
    };
    const overlap=(a,b)=>!(a.x1<b.x0+3||a.x0>b.x1-3||a.y1<b.y0+2||a.y0>b.y1-2);

    /* 候选位置按"行"组织：优先正上方不同高度（错行），
       再考虑斜上方/斜下方，最后正下方。
       行距从近到远递增，保证前面几个候选尽量靠近标记点。 */
    const cands=[];
    const rows=[16, 32, 48, 64, 80];
    for(const dy of rows) cands.push([q.x, q.y-dy, "center", "bottom"]);  // 正上方错行
    cands.push([q.x+11, q.y-11, "left",  "bottom"]);
    cands.push([q.x-11, q.y-11, "right", "bottom"]);
    for(const dy of rows) cands.push([q.x, q.y+dy, "center", "top"]);     // 正下方错行
    cands.push([q.x+11, q.y+11, "left",  "top"   ]);
    cands.push([q.x-11, q.y+11, "right", "top"   ]);

    let chosen=null;
    for(const [tx,ty,al,bl] of cands){
      const box=mkBox(tx,ty,al,bl);
      if(box.x0<M_RL.l+1 || box.x1>M_RL.l+iw-1) continue;
      if(box.y0<M_RL.t+16 || box.y1>M_RL.t+ih-1) continue;
      if(placedLabels.some(o=>overlap(box,o))) continue;
      // 不压住其它零极点符号（留 7px 净空）。
      // 注意排除自己的标记点：标注就在自己符号正上方是正常排版。
      const covers=others.some(o=>
        o!==q && o.x>box.x0-7 && o.x<box.x1+7 && o.y>box.y0-7 && o.y<box.y1+7);
      if(covers) continue;
      chosen={tx,ty,al,bl,box}; break;
    }
    // 兜底：只要不越界即可
    if(!chosen){
      for(const [tx,ty,al,bl] of cands){
        const box=mkBox(tx,ty,al,bl);
        if(box.x0<M_RL.l+1 || box.x1>M_RL.l+iw-1) continue;
        if(box.y0<M_RL.t+16 || box.y1>M_RL.t+ih-1) continue;
        chosen={tx,ty,al,bl,box}; break;
      }
    }
    if(!chosen) return;
    placedLabels.push(chosen.box);

    // 引导线：标注离符号较远时连一条细线，避免认错对象
    const ax = chosen.al==="left"? chosen.box.x0 : chosen.al==="right"? chosen.box.x1 : chosen.tx;
    const ay = chosen.bl==="bottom"? chosen.box.y1 : chosen.box.y0;
    if(Math.hypot(ax-q.x, ay-q.y) > 15){
      ctx.save();
      ctx.strokeStyle=color; ctx.globalAlpha=0.5; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(ax,ay); ctx.stroke();
      ctx.restore();
    }
    ctx.textAlign=chosen.al; ctx.textBaseline=chosen.bl;
    /* 用半透明圆角底衬而不是粗描边：
       粗描边会啃掉 "-" 这类细笔画，导致负号看不清。 */
    const bx=chosen.box;
    ctx.save();
    ctx.fillStyle="rgba(10,13,18,.82)";
    const rr=4, x0=bx.x0-3, y0=bx.y0-1, ww=bx.x1-bx.x0+6, hh=bx.y1-bx.y0+2;
    ctx.beginPath();
    ctx.moveTo(x0+rr,y0);
    ctx.lineTo(x0+ww-rr,y0); ctx.quadraticCurveTo(x0+ww,y0,x0+ww,y0+rr);
    ctx.lineTo(x0+ww,y0+hh-rr); ctx.quadraticCurveTo(x0+ww,y0+hh,x0+ww-rr,y0+hh);
    ctx.lineTo(x0+rr,y0+hh); ctx.quadraticCurveTo(x0,y0+hh,x0,y0+hh-rr);
    ctx.lineTo(x0,y0+rr); ctx.quadraticCurveTo(x0,y0,x0+rr,y0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle=color;
    ctx.fillText(txt, chosen.tx, chosen.ty);
  });
  ctx.restore();
}

/* 为一个"特征点"放置文字标签，带避让与边界钳位。
   与零极点标注共用同一套已放置列表，避免互相压住。 */
function placeFeatureLabel(ctx, txt, q, color, placedLabels, iw, ih, M){
  ctx.save();
  ctx.font="600 11px Consolas,\"Cascadia Mono\",\"Microsoft YaHei\",monospace";
  const w=ctx.measureText(txt).width+10, h=16;
  const mkBox=(tx,ty,al,bl)=>{
    const x0 = al==="left"? tx : al==="right"? tx-w : tx-w/2;
    const y0 = bl==="bottom"? ty-h : ty;
    return {x0,y0,x1:x0+w,y1:y0+h};
  };
  const overlap=(a,b)=>!(a.x1<b.x0+3||a.x0>b.x1-3||a.y1<b.y0+2||a.y0>b.y1-2);
  // 候选位置：优先左右不同高度错开，再上下
  const cands=[];
  const rows=[10, 24, 38, 52, 66];
  for(const dy of rows){
    cands.push([q.x+12, q.y-dy, "left",  "bottom"]);
    cands.push([q.x-12, q.y-dy, "right", "bottom"]);
  }
  for(const dy of rows){
    cands.push([q.x+12, q.y+dy, "left",  "top"]);
    cands.push([q.x-12, q.y+dy, "right", "top"]);
  }
  const inBounds=(b)=> b.x0>=M.l+1 && b.x1<=M.l+iw-1 && b.y0>=M.t+16 && b.y1<=M.t+ih-1;
  let chosen=null;
  for(const [tx,ty,al,bl] of cands){
    const box=mkBox(tx,ty,al,bl);
    if(!inBounds(box)) continue;
    if(placedLabels.some(o=>overlap(box,o))) continue;
    chosen={tx,ty,al,bl,box}; break;
  }
  if(!chosen){                      // 兜底：只要求不越界
    for(const [tx,ty,al,bl] of cands){
      const box=mkBox(tx,ty,al,bl);
      if(!inBounds(box)) continue;
      chosen={tx,ty,al,bl,box}; break;
    }
  }
  if(!chosen){ ctx.restore(); return; }
  placedLabels.push(chosen.box);

  // 引导线
  const ax = chosen.al==="left"? chosen.box.x0 : chosen.al==="right"? chosen.box.x1 : chosen.tx;
  const ay = chosen.bl==="bottom"? chosen.box.y1 : chosen.box.y0;
  if(Math.hypot(ax-q.x, ay-q.y) > 16){
    ctx.strokeStyle=color; ctx.globalAlpha=0.5; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(ax,ay); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // 圆角底衬 + 文字
  const bx=chosen.box;
  ctx.fillStyle="rgba(10,13,18,.86)";
  ctx.beginPath();
  const rr=4, x0=bx.x0-3, y0=bx.y0-1, ww=bx.x1-bx.x0+6, hh=bx.y1-bx.y0+2;
  ctx.moveTo(x0+rr,y0);
  ctx.lineTo(x0+ww-rr,y0); ctx.quadraticCurveTo(x0+ww,y0,x0+ww,y0+rr);
  ctx.lineTo(x0+ww,y0+hh-rr); ctx.quadraticCurveTo(x0+ww,y0+hh,x0+ww-rr,y0+hh);
  ctx.lineTo(x0+rr,y0+hh); ctx.quadraticCurveTo(x0,y0+hh,x0,y0+hh-rr);
  ctx.lineTo(x0,y0+rr); ctx.quadraticCurveTo(x0,y0,x0+rr,y0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=color;
  ctx.textAlign=chosen.al; ctx.textBaseline=chosen.bl;
  ctx.fillText(txt, chosen.tx, chosen.ty);
  ctx.restore();
}

/* 求根轨迹与【虚轴】的交点。
   虚轴是稳定边界，交点即临界增益对应的闭环极点。

   做法：令 s=jω 代入特征方程 D(s)+K·N(s)=0，得
       Dr + K·Nr = 0 ,  Di + K·Ni = 0
   其中 D(jω)=Dr+jDi，N(jω)=Nr+jNi。
   消去 K 得关于 ω 的条件： Dr·Ni − Di·Nr = 0
   对数扫描找变号区间 + 二分细化求 ω，再回代得 K。 */
function imagAxisCrossings(Nc, Dc){
  const out=[];
  if(!Nc || !Dc) return out;

  const f=(w)=>{
    const D=polyVal(Dc,w), N=polyVal(Nc,w);
    return D.re*N.im - D.im*N.re;
  };
  const wMin=1e-6, wMax=1e8, STEPS=4000;
  const roots=[];
  let prevW=wMin, prevF=f(wMin);
  for(let i=1;i<=STEPS;i++){
    const w=wMin*Math.pow(wMax/wMin, i/STEPS);
    const cur=f(w);
    if(isFinite(prevF) && isFinite(cur)){
      if(prevF===0){ roots.push(prevW); }
      else if(prevF*cur<0){
        // 二分（对数中点）细化
        let a=prevW, b=w, fa=prevF;
        for(let k=0;k<60;k++){
          const mid=Math.sqrt(a*b);
          const fm=f(mid);
          if(fa*fm<=0){ b=mid; } else { a=mid; fa=fm; }
        }
        roots.push(Math.sqrt(a*b));
      }
    }
    prevW=w; prevF=cur;
  }

  // 回代求 K，只保留 K>0 的解
  for(const w of roots){
    const D=polyVal(Dc,w), N=polyVal(Nc,w);
    const den=N.re*N.re+N.im*N.im;
    if(den<1e-300) continue;
    const K=-(D.re*N.re+D.im*N.im)/den;
    if(!isFinite(K) || K<=1e-9) continue;
    // 校验确为特征方程的根
    const chk=polyVal(pAdd(Dc.slice(), Nc.map(v=>v*K)), w);
    if(Math.hypot(chk.re,chk.im) > 1e-6*Math.max(1,Math.abs(K))) continue;
    out.push({ im:w, K });                     // s = jω
  }
  // 去重
  const uniq=[];
  for(const p of out){
    if(uniq.some(q=>Math.abs(q.im-p.im) < 1e-6*Math.max(1,Math.abs(p.im)))) continue;
    uniq.push(p);
  }
  return uniq;
}

function drawRootLocus(){
  const cv=document.getElementById("cv-rl");
  const {ctx,W,H}=setupCanvas(cv);
  if(!ctx) return;
  const view=state.rl.view;
  if(!view||!state.rl.data){
    /* 含纯滞后时根轨迹不可用：在画布上给出说明，而不是留一片空白。 */
    if(ctx && state.tau>0){
      ctx.save();
      ctx.fillStyle="#8b98a9";
      ctx.font='13px "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.textAlign="center"; ctx.textBaseline="middle";
      const cx=W/2, cy=H/2;
      const lines=[
        "含纯滞后环节 e^(−τs) 时无法绘制根轨迹",
        "",
        "特征方程 D(s)+K·N(s)·e^(−τs)=0 是超越方程，",
        "有无穷多个根，不能归结为多项式求根问题。",
        "",
        "请使用「奈奎斯特 / 伯德」页做频域分析——",
        "该页对延迟作精确计算（幅值不变、相位 −ωτ）。"
      ];
      ctx.fillStyle="#ffb340";
      ctx.font='600 15px "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.fillText(lines[0], cx, cy-lines.length*9);
      ctx.font='12.5px "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.fillStyle="#8b98a9";
      for(let k=1;k<lines.length;k++){
        if(lines[k]) ctx.fillText(lines[k], cx, cy-lines.length*9 + k*20);
      }
      ctx.restore();
    }
    return;
  }
  const {iw,ih,map}=rlMap(cv,view);

  drawComplexGrid(ctx,M_RL,iw,ih,view,map);

  // 轨迹（全红）
  const branchPx=[];
  ctx.save();
  ctx.lineWidth=2.2; ctx.strokeStyle=ARROW_COLOR;
  ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.shadowColor="rgba(230,0,18,.35)"; ctx.shadowBlur=6;
  state.rl.data.branches.forEach(br=>{
    const real=br.filter(Boolean);
    if(real.length<2) return;
    ctx.beginPath();
    real.forEach((p,i)=>{ const q=map(p.re,p.im); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
    ctx.stroke();
    branchPx.push(real.map(p=>map(p.re,p.im)));
  });
  ctx.restore();

  // K 方向箭头：K>0 指向 K 增大；K<0 指向 K 减小
  ctx.save();
  branchPx.forEach(pts=>drawFlowArrows(ctx,pts,state.kSign,ARROW_COLOR));
  ctx.restore();

  // 零极点符号（坐标标注在符号之后统一做，便于避让排版）
  const drawZPSymbol=(list,type)=>list.forEach(r=>{
    if(Math.abs(r.re)>1e7) return;
    const q=map(r.re,r.im);
    ctx.save(); ctx.lineWidth=2;
    if(type==="pole"){
      ctx.strokeStyle="#ffb340";
      const s=6; ctx.beginPath();
      ctx.moveTo(q.x-s,q.y-s); ctx.lineTo(q.x+s,q.y+s);
      ctx.moveTo(q.x+s,q.y-s); ctx.lineTo(q.x-s,q.y+s);
      ctx.stroke();
    }else{
      ctx.strokeStyle="#4fc3f7";
      ctx.beginPath(); ctx.arc(q.x,q.y,6,0,2*Math.PI); ctx.stroke();
    }
    ctx.restore();
  });
  drawZPSymbol(state.rl.data.poles,"pole");
  drawZPSymbol(state.rl.data.zeros,"zero");

  /* 标注顺序很重要：特征点（分离点、虚轴交点）信息量更大，
     先给它们占位，零极点标签随后避让；
     否则零极点标签先铺满，特征点标签会被挤到相近位置而互相重叠。 */
  const placedLabels=[];

  /* 关键特征点标注：分离点/会合点、与虚轴的交点。
     这两类点在画根轨迹时最常被问到，直接标在图上省去手算。 */

  // —— 分离点 / 会合点（由 dK/ds=0 解析求出）——
  let bps=[];
  try{ bps=breakawayPoints(state.Nc, state.Dc, state.kSign)||[]; }catch(_){ bps=[]; }
  bps.forEach(bp=>{
    const q=map(bp.s.re, bp.s.im);
    if(!isFinite(q.x)||!isFinite(q.y)) return;
    ctx.save();
    ctx.fillStyle="#7ee787";                    // 绿色，与红轨迹、橙极点区分
    ctx.strokeStyle="#0e1116"; ctx.lineWidth=1.5;
    const r=5;
    ctx.beginPath();
    ctx.moveTo(q.x, q.y-r); ctx.lineTo(q.x+r, q.y);
    ctx.lineTo(q.x, q.y+r); ctx.lineTo(q.x-r, q.y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    const txt = "分离点 " + fmtComplex(bp.s) + "  K=" + parseFloat(bp.K.toPrecision(4));
    placeFeatureLabel(ctx, txt, q, "#7ee787", placedLabels, iw, ih, M_RL);
  });

  // —— 与虚轴的交点（令 s=jω 代入特征方程求解）——
  // 实系数系统的虚轴交点必共轭成对，两点都标出；标签只在上半平面那侧写，
  // 避免同一组数据出现两条重复文字。
  let axisPts=[];
  try{ axisPts=imagAxisCrossings(state.Nc, state.Dc)||[]; }catch(_){ axisPts=[]; }
  axisPts.forEach(pt=>{
    for(const sign of [1,-1]){
      const im = pt.im*sign;
      const q=map(0, im);
      if(!isFinite(q.x)||!isFinite(q.y)) continue;
      ctx.save();
      ctx.fillStyle="#ff7b9c";                    // 粉红，与其它标记区分
      ctx.strokeStyle="#0e1116"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(q.x, q.y, 4.5, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    // 只在 +j 侧放标签
    const q=map(0, pt.im);
    if(!isFinite(q.x)||!isFinite(q.y)) return;
    const txt = "虚轴交点 s=±j" + parseFloat(Math.abs(pt.im).toPrecision(4))
              + "  K=" + parseFloat(pt.K.toPrecision(4));
    placeFeatureLabel(ctx, txt, q, "#ff7b9c", placedLabels, iw, ih, M_RL);
  });

  // 零极点坐标标注：放在特征点之后，自动避开已占用的位置
  drawZeroPoleLabels(ctx, state.rl.data.poles, "pole", map, placedLabels, iw, ih);
  drawZeroPoleLabels(ctx, state.rl.data.zeros, "zero", map, placedLabels, iw, ih);

  // 图例
  ctx.save();
  ctx.font=FONTSM;
  ctx.fillStyle="#ffb340"; ctx.textAlign="left"; ctx.textBaseline="top";
  ctx.fillText("× 极点", M_RL.l+6, M_RL.t+2);
  ctx.fillStyle="#4fc3f7"; ctx.fillText("○ 零点", M_RL.l+64, M_RL.t+2);
  ctx.fillStyle=ARROW_COLOR;
  ctx.fillText("▶ K "+(state.kSign>0?"增大":"减小")+"方向", M_RL.l+128, M_RL.t+2);
  ctx.restore();

  // 视口提示
  ctx.save();
  ctx.font=FONTSM; ctx.fillStyle="#8b98a9";
  ctx.textAlign="right"; ctx.textBaseline="bottom";
  ctx.fillText("视口 ±"+view.half.toPrecision(3)+"　等比坐标　K "+(state.kSign>0?"→ +∞":"→ −∞"), M_RL.l+iw, H-6);
  ctx.restore();
}

/* ===========================================================
   幅相频特性（奈奎斯特极坐标）
   =========================================================== */
function drawPolar(){
  const cv=document.getElementById("cv-pol");
  const {ctx,W,H}=setupCanvas(cv);
  if(!ctx) return;
  const view=state.ny.view;
  if(!view||!state.ny.data) return;
  const iw=W-M_POL.l-M_POL.r, ih=H-M_POL.t-M_POL.b;
  const k=Math.min(iw,ih)/(2*view.half);
  const map=(x,y)=>({x:M_POL.l+iw/2+(x-view.cx)*k, y:M_POL.t+ih/2-(y-view.cy)*k});

  drawComplexGrid(ctx,M_POL,iw,ih,view,map);

  // 单位圆
  ctx.save();
  ctx.strokeStyle="rgba(120,140,170,.28)"; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  const o=map(0,0);
  ctx.beginPath(); ctx.arc(o.x,o.y,k,0,2*Math.PI); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  const pts=state.ny.data.freq;
  if(pts.length>1){
    // ω>0 支（实线）
    ctx.save();
    ctx.lineWidth=2; ctx.strokeStyle="#4fc3f7"; ctx.lineJoin="round";
    ctx.beginPath();
    pts.forEach((p,i)=>{ const q=map(p.re,p.im); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
    ctx.stroke();
    // ω<0 支（共轭镜像，虚线）
    ctx.strokeStyle="rgba(79,195,247,.45)"; ctx.setLineDash([5,4]); ctx.lineWidth=1.6;
    ctx.beginPath();
    pts.forEach((p,i)=>{ const q=map(p.re,-p.im); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // ω 方向箭头：ω>0 指向 ω 增大，ω<0 指向 ω 减小
    const posPx=pts.map(p=>map(p.re,p.im));
    drawFlowArrows(ctx,posPx,state.wSign,"#7fe3ff",6);
    const negPx=pts.map(p=>map(p.re,-p.im));
    drawFlowArrows(ctx,negPx,-state.wSign,"rgba(127,227,255,.7)",5);

    // ω 标注：按 ω 的对数均匀取点（而非数组索引），
    // 保证标注在频率上均匀分布，不会挤在一起。
    ctx.save();
    ctx.font=FONTSM;
    const lwA=Math.log10(pts[0].w), lwB=Math.log10(pts[pts.length-1].w);
    const nMark=4;
    const idxs=[];
    for(let k=0;k<=nMark;k++){
      const target=lwA+(lwB-lwA)*k/nMark;
      let bi=0, bd=Infinity;
      pts.forEach((p,i)=>{ const d=Math.abs(Math.log10(p.w)-target); if(d<bd){ bd=d; bi=i; } });
      if(!idxs.includes(bi)) idxs.push(bi);
    }
    const topLim=M_POL.t+2;
    const placed=[];                                     // 已放置的标签位置，用于避让
    idxs.forEach(mi=>{
      const p=pts[mi]; if(!p) return;
      const q=map(p.re,p.im);
      ctx.fillStyle="#7fe3ff";
      ctx.beginPath(); ctx.arc(q.x,q.y,2.6,0,2*Math.PI); ctx.fill();
      ctx.fillStyle="#9fb0c6";
      let tx=q.x+6, ty=q.y-5, align="left", base="bottom";
      if(ty<topLim){ ty=q.y+6; base="top"; }
      if(tx>M_POL.l+iw-46){ tx=q.x-6; align="right"; }
      // 与已放置标签冲突时逐行下移（或上移），直到找到不冲突的位置
      for(let guard=0; guard<4; guard++){
        const hit=placed.some(pl=>Math.abs(pl.x-tx)<52 && Math.abs(pl.y-ty)<12);
        if(!hit) break;
        ty += (base==="bottom" ? -13 : 13);
        if(ty<topLim){ base="top"; ty=q.y+6; }
        if(ty>M_POL.t+ih-12){ base="bottom"; ty=q.y-5; }
      }
      placed.push({x:tx,y:ty});
      ctx.textAlign=align; ctx.textBaseline=base;
      ctx.fillText("ω="+sig3(p.w), tx, ty);
    });
    ctx.restore();
  }
  // 图例已移到 HTML 层（.legend），此处不再绘制，避免与曲线上的 ω 标注重叠
}

/* ===========================================================
   伯德图
   =========================================================== */
function drawBode(){
  const cv=document.getElementById("cv-bode");
  const {ctx,W,H}=setupCanvas(cv);
  if(!ctx) return;
  if(!state.ny.data) return;
  const pts=state.ny.data.freq;
  /* 边距随画布宽度自适应：
     窄屏（手机）上固定 58px 的左右边距会占掉太多宽度，
     且相位刻度写在 W-m.r+6 处容易被画布右缘裁掉。 */
  const narrow = W < 520;
  // 右侧要放得下 "−326°" 这类刻度，窄屏也不能压得太狠
  const m={ l: narrow?40:58, r: narrow?40:58, t: narrow?22:26, b: narrow?22:26 };
  const iw=W-m.l-m.r;

  /* 融合动画：mix=0 时上下分成两格；mix=1 时两格在纵向上重叠成一格。
     做法是让两格的「高度」和「纵向偏移」随 mix 连续插值：
       - 高度：ih_split -> ih_full
       - 相频格的纵向起点：botY_split -> alignY
     这样切换时两幅图会平滑地互相靠拢、合并，而不是硬切。 */
  const mix = Math.max(0, Math.min(1, state.bode && state.bode.mix || 0));

  const gap = narrow?18:24;
  // 分离态：两格各占一半
  const ihSplit=(H-m.t-m.b-gap)/2;
  // 合并态：两格各占满（重叠）
  const ihFull=H-m.t-m.b;
  // 高度按 mix 插值
  const ih = ihSplit + (ihFull-ihSplit)*mix;

  const topY=m.t;
  // 相频格的纵向起点：分离态在下方，合并态与幅频格对齐
  const botYSplit=m.t+ihSplit+gap;
  const botY = botYSplit + (topY-botYSplit)*mix;

  /* 幅频格的纵向位置：合并时略微上移，相频格略下移，
     让两条曲线在同一张图里错开，不至于完全压在一起。 */
  const dbShift = -mix*ihFull*0.06;      // 幅频上移
  const phShift =  mix*ihFull*0.06;      // 相频下移
  const topYdb = topY + dbShift;
  const botYph = botY + phShift;

  /* 透明度：分离态两格都完全不透明；
     融合过程中让相频格保持可见（否则合并时看不到相频）。
     这里用一个"半透明叠加"的做法：合并态时相频曲线用虚线并使底色透明。 */
  const phAlpha = 1;                     // 相频始终可见，靠混色区分

  const lw0=Math.log10(state.w1), lw1=Math.log10(state.w2);
  const X=(lw)=>m.l+(lw-lw0)/(lw1-lw0)*iw;

  /* 幅值范围（dB）。
     不能直接用全范围：低频段增益会掉到 -250dB 这种极端值，
     会把整个纵轴拉伸、曲线挤成一条线。
     这里改用"分位裁剪"：取 2%~98% 分位作为主体，再单独保证
     0dB(穿越频率附近最关心) 落在视野内；只有当极值离主体不太远时才纳入。 */
  const dbs=pts.map(p=>20*Math.log10(p.mag)).filter(v=>isFinite(v)).sort((a,b)=>a-b);
  let aMin,aMax;
  if(dbs.length){
    const q=(f)=>dbs[Math.min(dbs.length-1,Math.max(0,Math.round(f*(dbs.length-1))))];
    aMin=q(0.02); aMax=q(0.98);
    // 0dB 是伯德图关键参考，尽量纳入
    if(0>=aMin-6 && 0<=aMax+6){ aMin=Math.min(aMin,0); aMax=Math.max(aMax,0); }
    // 极值若离主体不太远（不超过主体跨度），则纳入使曲线完整
    const body=Math.max(aMax-aMin,1);
    if(dbs[0] > aMin-body) aMin=dbs[0];
    if(dbs[dbs.length-1] < aMax+body) aMax=dbs[dbs.length-1];
  }else{ aMin=-40; aMax=40; }
  // 保证有最小跨度，避免直流系统被放大到无意义
  if(aMax-aMin < 20){ const c=(aMin+aMax)/2; aMin=c-10; aMax=c+10; }
  let sp=(aMax-aMin)*0.08||1;
  aMin-=sp; aMax+=sp;
  // 目标 9 个主刻度：跨度大时也能看清中间值（原来 5 个过稀）
  let st=niceStep(aMax-aMin,9);
  aMin=Math.floor(aMin/st)*st; aMax=Math.ceil(aMax/st)*st;
  const Ydb=(db)=>topYdb+ih-(db-aMin)/(aMax-aMin)*ih;

  /* 相位范围：同样做分位裁剪。
     相位往往卷绕很多圈，全范围会让曲线几乎水平。 */
  const phs=pts.map(p=>p.ph).filter(v=>isFinite(v)).sort((a,b)=>a-b);
  let pMin,pMax;
  if(phs.length){
    const qp=(f)=>phs[Math.min(phs.length-1,Math.max(0,Math.round(f*(phs.length-1))))];
    pMin=qp(0.02); pMax=qp(0.98);
    const body=Math.max(pMax-pMin,1e-6);
    if(phs[0] > pMin-body) pMin=phs[0];
    if(phs[phs.length-1] < pMax+body) pMax=phs[phs.length-1];
  }else{ pMin=-Math.PI; pMax=Math.PI; }
  if(pMax-pMin < 0.5){ const c=(pMin+pMax)/2; pMin=c-0.25; pMax=c+0.25; }
  let sp2=(pMax-pMin)*0.08||0.2;
  pMin-=sp2; pMax+=sp2;
  let st2=niceStep(pMax-pMin,9);
  pMin=Math.floor(pMin/st2)*st2; pMax=Math.ceil(pMax/st2)*st2;
  const Yph=(ph)=>botYph+ih-(ph-pMin)/(pMax-pMin)*ih;

  const sup=(d)=>{ const mp={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻"};
    return String(d).split("").map(c=>mp[c]||c).join(""); };

  const frame=(y,h,unit)=>{
    ctx.save();
    /* 融合状态下两个框会重叠：只画外框，避免出现两层横线。
       fadeTop 为真时略去顶边（与幅频框的底边重合）。 */
    ctx.strokeStyle="#232b37"; ctx.lineWidth=1;
    if(unit.fadeTop){
      ctx.beginPath();
      ctx.moveTo(m.l,y+h); ctx.lineTo(m.l,y);
      ctx.moveTo(m.l+iw,y+h); ctx.lineTo(m.l+iw,y);
      ctx.moveTo(m.l,y+h); ctx.lineTo(m.l+iw,y+h);
      ctx.stroke();
    }else{
      ctx.strokeRect(m.l,y,iw,h);
    }
    ctx.strokeStyle="#171e28";
    for(let d=Math.ceil(lw0); d<=Math.floor(lw1); d++){
      const x=X(d);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+h); ctx.stroke();
    }
    // 十倍频程刻度（只在下方那格标注，避免中间拥挤）
    if(unit.bottom){
      ctx.font=FONTSM; ctx.fillStyle="#7f8b9b";
      ctx.textAlign="center"; ctx.textBaseline="top";
      for(let d=Math.ceil(lw0); d<=Math.floor(lw1); d++) ctx.fillText("10"+sup(d), X(d), y+h+5);
    }
    // 单位标签：融合态下两格标题靠得很近，改为分别贴各自框的上/下缘
    ctx.font=FONTSM; ctx.fillStyle="#9fb0c6";
    ctx.textAlign="left"; ctx.textBaseline = unit.titleBottom ? "bottom" : "top";
    const ty = unit.titleBottom ? (y+h-4) : (y+4);
    ctx.fillText(unit.text, m.l+6, ty);
    ctx.restore();
  };
  /* 两格的框：分离态各自独立；融合时相频框与幅频框逐渐重合。
     融合到一定程度后，相频框只保留左右边与底边，避免出现两层横线。 */
  frame(topYdb,ih,{text:"幅频 [dB]", bottom:false});
  // 融合态下把相频标题压到框内底部，避免与幅频标题叠在一起
  frame(botYph,ih,{text:"相频 [°]", bottom:true, fadeTop:mix>0.5, titleBottom:mix>0.5});

  /* 幅频参考网格：每 20dB 一条细横线，让读数更清楚。
     主刻度（st）已由左侧数字标出，这里只画次级线。 */
  ctx.save();
  ctx.strokeStyle="rgba(120,140,170,.10)"; ctx.lineWidth=1;
  const subDb=20;                              // 次级网格间隔
  for(let d=Math.ceil(aMin/subDb)*subDb; d<=aMax; d+=subDb){
    if(Math.abs(d % st) < 1e-9) continue;      // 与主刻度重合的跳过
    const y=Ydb(d);
    ctx.beginPath(); ctx.moveTo(m.l,y); ctx.lineTo(m.l+iw,y); ctx.stroke();
  }
  ctx.restore();

  /* 相频参考线：每隔 90° 画一条虚线（0、-90、-180、-270 …）。
     这是伯德图判稳的常用参考——相位穿越 -180° 处对应增益裕度。 */
  ctx.save();
  const d2r=Math.PI/180;
  const degMin=pMin/d2r, degMax=pMax/d2r;
  for(let deg=Math.ceil(degMin/90)*90; deg<=degMax; deg+=90){
    const y=Yph(deg*d2r);
    const isKey = (deg % 180 === 0);            // -180 是最关键的一条
    ctx.setLineDash(isKey?[6,4]:[3,5]);
    ctx.strokeStyle = isKey ? "rgba(255,179,64,.55)" : "rgba(120,140,170,.32)";
    ctx.lineWidth = isKey ? 1.4 : 1;
    ctx.beginPath(); ctx.moveTo(m.l,y); ctx.lineTo(m.l+iw,y); ctx.stroke();
    /* 角度值标在虚线【左端、框内】，避免与框外的坐标刻度数字重叠。
       之前标在右端，和 m.l+iw+5 处的刻度数字挤在一起。 */
    ctx.setLineDash([]);
    ctx.font=FONTSM; ctx.fillStyle = isKey ? "#ffb340" : "#6b7686";
    ctx.textAlign="left"; ctx.textBaseline="bottom";
    ctx.fillText(deg+"°", m.l+4, y-2);
  }
  ctx.restore();

  // 幅频曲线
  if(pts.length>1){
    const dbPts=pts.filter(p=>isFinite(p.mag))
                    .map(p=>({x:X(Math.log10(p.w)), y:Ydb(20*Math.log10(p.mag)),
                              w:p.w, db:20*Math.log10(p.mag)}));
    ctx.save();
    ctx.lineWidth=2; ctx.strokeStyle="#35c1ff"; ctx.lineJoin="round";
    ctx.beginPath();
    dbPts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.stroke(); ctx.restore();
    drawFlowArrows(ctx,dbPts,state.wSign,"#7fe3ff",4);

    /* 标出幅频曲线与 0dB 轴的交点（幅值穿越频率 ωc）。
       在最靠近 0dB 的两点之间做线性插值，得到较精确的 ωc。 */
    let cross=null;
    for(let i=1;i<dbPts.length;i++){
      const a=dbPts[i-1], b=dbPts[i];
      if((a.db>=0 && b.db<=0) || (a.db<=0 && b.db>=0)){
        const t = Math.abs(b.db-a.db)<1e-12 ? 0 : (0-a.db)/(b.db-a.db);
        const lw = Math.log10(a.w) + t*(Math.log10(b.w)-Math.log10(a.w));
        cross={ w:Math.pow(10,lw), db:0 };
        break;
      }
    }
    if(cross){
      const cx=X(Math.log10(cross.w)), cy=Ydb(0);
      ctx.save();
      // 标记点
      ctx.fillStyle="#ffd166";
      ctx.beginPath(); ctx.arc(cx,cy,4,0,2*Math.PI); ctx.fill();
      ctx.strokeStyle="#0e1116"; ctx.lineWidth=1.5; ctx.stroke();
      // 竖向虚线下引到相频格底部（融合态下也要落到画布底）
      ctx.setLineDash([3,3]); ctx.strokeStyle="rgba(255,209,102,.65)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,botYph+ih); ctx.stroke();
      ctx.setLineDash([]);
      // 坐标文字：ωc 与 0dB
      const label="ωc="+sig3(cross.w);
      ctx.font="600 11px Consolas,\"Cascadia Mono\",monospace";
      const tw=ctx.measureText(label).width;
      // 文字框避免超出绘图区
      let tx=cx+8, align="left";
      if(tx+tw > m.l+iw-4){ tx=cx-8; align="right"; }
      ctx.textAlign=align; ctx.textBaseline="bottom";
      // 底衬
      ctx.fillStyle="rgba(14,17,22,.85)";
      const bx = align==="left"? tx-3 : tx-tw-3;
      ctx.fillRect(bx, cy-16, tw+6, 14);
      ctx.fillStyle="#ffd166";
      ctx.fillText(label, tx, cy-4);
      ctx.restore();
    }

    // 相频曲线
    const phPts=pts.filter(p=>isFinite(p.ph))
                    .map(p=>({x:X(Math.log10(p.w)), y:Yph(p.ph)}));
    ctx.save();
    ctx.lineWidth=2; ctx.strokeStyle="#ffb340"; ctx.lineJoin="round";
    ctx.beginPath();
    phPts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.stroke(); ctx.restore();
    drawFlowArrows(ctx,phPts,state.wSign,"#ffd27f",4);

    /* 标出相位穿越 -180° 的频率（相位穿越频率 ωg），
       与增益裕度相关，是判稳常用量。 */
    let pcross=null;
    const phValid=pts.filter(p=>isFinite(p.ph));
    for(let i=1;i<phValid.length && !pcross;i++){
      const a=phValid[i-1], b=phValid[i];
      for(const target of [-Math.PI, -3*Math.PI]){
        if((a.ph>=target && b.ph<=target) || (a.ph<=target && b.ph>=target)){
          const t=Math.abs(b.ph-a.ph)<1e-12?0:(target-a.ph)/(b.ph-a.ph);
          const lw=Math.log10(a.w)+t*(Math.log10(b.w)-Math.log10(a.w));
          pcross={ w:Math.pow(10,lw), deg:target*180/Math.PI };
          break;
        }
      }
    }
    if(pcross){
      const cx=X(Math.log10(pcross.w)), cy=Yph(pcross.deg*d2r);
      ctx.save();
      ctx.fillStyle="#ffb340";
      ctx.beginPath(); ctx.arc(cx,cy,3.5,0,2*Math.PI); ctx.fill();
      ctx.strokeStyle="#0e1116"; ctx.lineWidth=1.4; ctx.stroke();
      const label="ωg="+sig3(pcross.w);
      ctx.font="600 11px Consolas,\"Cascadia Mono\",monospace";
      const tw=ctx.measureText(label).width;
      let tx=cx+7, align="left";
      if(tx+tw > m.l+iw-4){ tx=cx-7; align="right"; }
      ctx.textAlign=align; ctx.textBaseline="bottom";
      ctx.fillStyle="rgba(14,17,22,.85)";
      const bx = align==="left"? tx-3 : tx-tw-3;
      ctx.fillRect(bx, cy-15, tw+6, 13);
      ctx.fillStyle="#ffb340";
      ctx.fillText(label, tx, cy-3);
      ctx.restore();
    }
  }

  // 刻度
  ctx.save();
  /* 幅频刻度：用更密的目标刻度数（原来 5 个，跨 250dB 时每 50dB 才标一个，
     读数不便）。这里取 8~10 个主刻度，数值更清楚。 */
  ctx.font=FONTSM; ctx.fillStyle="#9aa7b6";
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let d=aMin; d<=aMax+1e-9; d+=st){
    const y=Ydb(d);
    const txt = Math.abs(d)<1e-9 ? "0" : (Number.isInteger(d) ? String(d) : d.toFixed(1));
    ctx.fillText(txt, m.l-6, y);
    // 主刻度加一小段刻度线，便于对齐
    ctx.strokeStyle="rgba(120,140,170,.35)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(m.l-4,y); ctx.lineTo(m.l,y); ctx.stroke();
  }
  // 单位提示
  ctx.font="10px \"Segoe UI\",\"Microsoft YaHei\",sans-serif";
  ctx.fillStyle="#6b7686"; ctx.textAlign="right"; ctx.textBaseline="top";
  ctx.fillText("dB", m.l-6, 2);
  // 相位刻度：紧贴绘图区右侧。
  // 窄屏时右侧留给刻度的宽度很有限，改用更紧凑的写法（去掉度数符号、缩小字号），
  // 否则 "−326°" 这类文本会被画布右缘裁掉。
  ctx.textAlign="left";
  const phTickX = m.l+iw+5;
  if(narrow){
    ctx.font="10px \"Segoe UI\",\"Microsoft YaHei\",sans-serif";
    for(let d=pMin; d<=pMax+1e-9; d+=st2){
      const y=Yph(d);
      ctx.fillText((d*180/Math.PI).toFixed(0), phTickX, y);
    }
    // 用一个单位标签说明是角度
    ctx.fillStyle="#6b7686";
    ctx.fillText("°", phTickX, botYph-9);
  }else{
    const phDigits = (pMax-pMin)*180/Math.PI >= 60 ? 0 : 1;
    for(let d=pMin; d<=pMax+1e-9; d+=st2){
      const y=Yph(d);
      ctx.fillText((d*180/Math.PI).toFixed(phDigits)+"°", phTickX, y);
    }
  }
  ctx.restore();

  // 0dB / 0° 参考线
  ctx.save();
  ctx.setLineDash([4,4]); ctx.strokeStyle="rgba(120,140,170,.35)";
  if(0>=aMin&&0<=aMax){ const y=Ydb(0); ctx.beginPath(); ctx.moveTo(m.l,y); ctx.lineTo(m.l+iw,y); ctx.stroke(); }
  if(0>=pMin&&0<=pMax){ const y=Yph(0); ctx.beginPath(); ctx.moveTo(m.l,y); ctx.lineTo(m.l+iw,y); ctx.stroke(); }
  ctx.restore();

  // ω 范围提示：放在画布右上角。
  // 窄屏下与图例文字容易撞在一起，故窄屏改用更短的写法。
  ctx.save();
  ctx.font=FONTSM; ctx.fillStyle="#8b98a9";
  ctx.textAlign="right"; ctx.textBaseline="top";
  const wTxt = narrow
    ? "ω "+sig3(state.w1)+"~"+sig3(state.w2)
    : "ω: "+sig3(state.w1)+" ~ "+sig3(state.w2)+" rad/s";
  ctx.fillText(wTxt, W-6, 2);
  ctx.restore();
}

/* ===========================================================
   视口自动适应
   =========================================================== */
/* 幅相频（奈奎斯特）自动视野。
   要点：
   1) 极坐标图必须等比（否则单位圆会变椭圆），所以只有一个 half。
   2) 视野要"框住曲线主体"，同时尽量让关键点 (-1,0) 和原点可见——
      这两处是判稳的依据。
   3) 曲线常常沿虚轴很长而实部很窄（如 1/[s(s+2)(s+5)] 实部只有 0.35），
      若按纵横比的较大者取景，横向会留出大片空白。
      这里改用"关键点优先 + 曲线分位"策略：
      - 先算曲线主体的分位包围盒
      - 把 (-1,0) 与原点作为必须纳入的点（除非它们离得极远）
      - 取包围这些点的最小等比圆
      这样既能看清曲线，又不会丢掉判稳所需的位置关系。 */
/* 幅相频（奈奎斯特）自动视野 —— 聚焦曲线靠原点的部分。

   背景：1/[s(s+2)(s+5)] 的 Nyquist 曲线几乎是一条从原点沿虚轴
   向下延伸到 -10 的直线。这类"细长"曲线如果按全范围取景，
   在等比坐标下必然是一根细线，四周大量空白，形状看不清。

   既然曲线形状本身就细长，用户要的是"尽量放大"：
   即取一个紧的窗口，只展示靠近原点的一段（ω 较大的部分，
   含曲线终点 G(j∞)=0 与几个采样标注点），长尾伸出画面。

   做法：取"曲线靠原点的前 K% 点"所在的最大半径作为窗口。
   注意要用【沿曲线的采样顺序】而不是到原点的距离排序——
   两者的语义不同，前者对应"ω 从大到小走多远"。 */
function autoFitNY(){
  const pts=state.ny.data.freq.filter(p=>isFinite(p.re)&&isFinite(p.im)
                                       &&Math.abs(p.re)<1e6&&Math.abs(p.im)<1e6);
  if(!pts.length) return;

  const dists=pts.map(p=>Math.hypot(p.re,p.im));
  const sorted=dists.slice().sort((a,b)=>a-b);
  const dMax=sorted[sorted.length-1]||0;

  /* 沿曲线的累计弧长（按 ω 采样顺序，不是按到原点距离排序）。
     这是曲线真实长度分布：
       - ω 从大到小，曲线从原点附近沿虚轴向下延伸
       - 累计到总弧长某比例处的半径，就是"曲线走了这么远"的位置
     取总弧长的 ARC_FRAC 作为窗口，可得到一个与曲线几何相符的紧窗口。 */
  const along=[0];
  for(let i=1;i<pts.length;i++){
    along.push(along[i-1]+Math.hypot(pts[i].re-pts[i-1].re, pts[i].im-pts[i-1].im));
  }
  const totalArc=along[along.length-1]||0;

  /* 窗口半径：沿曲线从"靠原点的一端"（ω→∞ 那端）累计到总弧长的 10%。
     实测 1/[s(s+2)(s+5)] 的对照：
        弧长 5% -> R≈0.48   弧长 10% -> R≈0.99   弧长 20% -> R≈2.0
     取 10% 可以得到约 ±1 的窗口——既能看清曲线靠原点的走向，
     又比全范围（R≈10）放大了一个数量级，长尾自然出画。 */
  const ARC_FRAC=0.10;
  let half=0;
  if(totalArc>0){
    const target=totalArc*ARC_FRAC;
    // 从 ω 最大端（索引末尾，G≈0）向 ω 小的一端走
    for(let i=pts.length-1;i>=0;i--){
      const walked=totalArc-along[i];       // 从末尾走到 i 已走的弧长
      if(walked >= target){
        half=Math.hypot(pts[i].re, pts[i].im);
        break;
      }
    }
  }
  /* 若弧长法失败（曲线退化为一点等），退回一个与整体尺度相关的值。 */
  if(!isFinite(half) || half<=0){
    half = dMax>0 ? dMax*0.12 : 1e-3;
  }
  // 绝对下限
  if(!isFinite(half) || half<=0) half = 1e-3;

  // 留白：尽量放大，只留一点点
  half *= 1.06;

  /* 中心：让窗口尽量贴近曲线在原点附近的那一段。
     取窗口内点的分位中心，并把中心拉向原点，
     保证原点（曲线起点）附近始终可见。 */
  const inside=pts.filter(p=>Math.hypot(p.re,p.im) <= half/1.06);
  let cxm=0, cym=0;
  if(inside.length){
    const xs=inside.map(p=>p.re).sort((a,b)=>a-b);
    const ys=inside.map(p=>p.im).sort((a,b)=>a-b);
    const qq=(arr,f)=>arr[Math.min(arr.length-1, Math.max(0, Math.round(f*(arr.length-1))))];
    cxm=(qq(xs,0.05)+qq(xs,0.95))/2;
    cym=(qq(ys,0.05)+qq(ys,0.95))/2;
  }
  // 中心与原点距离不超过 half 的 30%，确保原点附近可见
  const dOrig=Math.hypot(cxm,cym);
  if(dOrig > half*0.30){
    const s=half*0.30/dOrig;
    cxm*=s; cym*=s;
  }
  state.ny.view={cx:cxm, cy:cym, half};
}
